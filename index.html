                        onClick={(e) => deleteShopItem(item.id, e)} 
                        class="text-slate-300 dark:text-slate-600 hover:text-rose-500 text-xs px-2 py-1"
                      >
                        ✕
                      </button>
                    </div>
                  ))}
                </div>
              </main>
            )}

            {/* ВКЛАДКА 6: НАСТРОЙКИ */}
            {activeTab === 'settings' && (
              <main class="p-4 space-y-4">
                <div class="flex justify-between items-center px-1">
                  <div>
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Настройки</h2>
                    <p class="text-[11px] text-slate-500">Персонализация, журнал и управление базой</p>
                  </div>
                  <button
                    onClick={() => setActiveTab('calendar')}
                    class="text-xs font-bold bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 text-slate-700 dark:text-slate-200 px-3 py-1.5 rounded-xl transition"
                  >
                    ← Назад
                  </button>
                </div>

                {/* ПЕРЕКЛЮЧАТЕЛЬ ТЕМНОЙ ТЕМЫ */}
                <div class="bg-white dark:bg-slate-900 p-3.5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 flex justify-between items-center">
                  <div>
                    <span class="text-xs font-bold text-slate-700 dark:text-slate-200">🌙 Тёмная тема (Dark Mode)</span>
                    <p class="text-[11px] text-slate-400">Комфортно для глаз в вечернее время</p>
                  </div>
                  <button
                    onClick={toggleDarkMode}
                    class={`w-12 h-7 rounded-full p-1 transition-colors duration-200 ease-in-out ${
                      isDarkMode ? 'bg-indigo-600' : 'bg-slate-300'
                    }`}
                  >
                    <div class={`w-5 h-5 rounded-full bg-white transition-transform duration-200 ease-in-out ${
                      isDarkMode ? 'translate-x-5' : 'translate-x-0'
                    }`} />
                  </button>
                </div>

                {/* ВЫБОР ЦВЕТОВОЙ ТЕМЫ */}
                <div class="bg-white dark:bg-slate-900 p-3.5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 space-y-2.5">
                  <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-slate-700 dark:text-slate-200">🎨 Цвет оформления для роли «{currentUser}»:</span>
                    <span class="text-[11px] font-semibold text-slate-400">{theme.name}</span>
                  </div>
                  <div class="grid grid-cols-6 gap-2 pt-1">
                    {Object.entries(THEME_PALETTES).map(([key, val]) => (
                      <button
                        key={key}
                        onClick={() => setAndSaveUserTheme(key)}
                        class={`h-9 rounded-xl ${val.primary} text-white flex items-center justify-center font-bold text-xs shadow-xs transition transform active:scale-90 ${
                          currentThemeKey === key ? 'ring-2 ring-offset-2 ring-slate-700 dark:ring-slate-300 scale-105' : 'opacity-80'
                        }`}
                        title={val.name}
                      >
                        {currentThemeKey === key && '✓'}
                      </button>
                    ))}
                  </div>
                </div>

                {/* УПРАВЛЕНИЕ КАТЕГОРИЯМИ КАНБАНА */}
                <div class="bg-white dark:bg-slate-900 p-3.5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 space-y-2.5">
                  <span class="text-xs font-bold text-slate-700 dark:text-slate-200">🏷️ Категории недельного расписания</span>
                  <div class="flex flex-wrap gap-1.5 pt-1">
                    {categories.map((cat, i) => (
                      <span key={i} class="inline-flex items-center gap-1.5 text-xs bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 px-2.5 py-1 rounded-xl font-medium">
                        {cat}
                        {categories.length > 1 && (
                          <button onClick={() => handleDeleteCategory(cat)} class="text-slate-400 hover:text-rose-500 text-[10px]">✕</button>
                        )}
                      </span>
                    ))}
                  </div>
                  <form onSubmit={handleAddCategory} class="flex gap-2 pt-1">
                    <input
                      type="text"
                      placeholder="Новая категория..."
                      value={newCustomCategoryInput}
                      onChange={(e) => setNewCustomCategoryInput(e.target.value)}
                      class="flex-1 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-1.5 text-xs outline-none text-slate-800 dark:text-slate-100"
                    />
                    <button type="submit" class={`${theme.primary} text-white text-xs font-bold px-3 py-1.5 rounded-xl`}>
                      + Добавить
                    </button>
                  </form>
                </div>

                {/* ИСТОРИЯ ИЗМЕНЕНИЙ */}
                <div class="bg-white dark:bg-slate-900 p-3.5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 space-y-2.5">
                  <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-slate-700 dark:text-slate-200">🕒 История действий (кто что менял)</span>
                    <span class="text-[10px] text-slate-400">Последние 40</span>
                  </div>

                  <div class="max-h-60 overflow-y-auto space-y-2 no-scrollbar pr-1">
                    {activityLogs.length === 0 ? (
                      <p class="text-xs text-slate-400 text-center py-4">История пуста. Действия появятся по мере работы.</p>
                    ) : (
                      activityLogs.map((log) => {
                        const timeStr = log.created_at ? new Date(log.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '';
                        return (
                          <div key={log.id} class="flex items-start gap-2 text-xs border-b border-slate-50 dark:border-slate-800/60 pb-1.5">
                            <span class={`text-[9px] font-bold px-1.5 py-0.2 rounded mt-0.5 shrink-0 ${
                              log.user_name === 'Рома' ? 'bg-sky-100 dark:bg-sky-950/80 text-sky-800 dark:text-sky-300' :
                              log.user_name === 'Марина' ? 'bg-pink-100 dark:bg-pink-950/80 text-pink-700 dark:text-pink-300' : 'bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300'
                            }`}>
                              {log.user_name}
                            </span>
                            <span class="text-slate-600 dark:text-slate-300 flex-1 leading-snug">{log.action_text}</span>
                            <span class="text-[10px] text-slate-300 dark:text-slate-500 font-mono shrink-0">{timeStr}</span>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>

                {/* РЕЗЕРВНАЯ КОПИЯ */}
                <div class="bg-white dark:bg-slate-900 p-3.5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 flex justify-between items-center">
                  <div>
                    <h4 class="text-xs font-bold text-slate-700 dark:text-slate-200">📦 Резервная копия базы</h4>
                    <p class="text-[11px] text-slate-400">Скачать файл со всеми задачами и рецептами</p>
                  </div>
                  <button
                    onClick={exportFamilyDataBackup}
                    class="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold px-3 py-2 rounded-xl transition active:scale-95"
                  >
                    Экспорт JSON
                  </button>
                </div>
              </main>
            )}
          </div>

          {/* МОДАЛЬНОЕ ОКНО ПЕРЕНОСА ЗАДАЧИ НА ДАТУ (СВАЙП ВЛЕВО) */}
          {moveModalTask && (
            <div class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 animate-fade-in">
              <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-5 space-y-4 border border-slate-200 dark:border-slate-800 shadow-2xl">
                <div class="flex justify-between items-center">
                  <div>
                    <h3 class="text-sm font-bold text-slate-800 dark:text-slate-100">Перенести задачу</h3>
                    <p class="text-xs text-slate-400 truncate max-w-[240px]">«{moveModalTask.text}»</p>
                  </div>
                  <button onClick={() => setMoveModalTask(null)} class="text-slate-400 hover:text-slate-600 text-base p-1">✕</button>
                </div>

                {/* Быстрые пресеты */}
                <div class="grid grid-cols-3 gap-2">
                  <button
                    onClick={() => applyMoveToDate(addDaysToIsoDate(moveModalTask.date, 1))}
                    class="py-2 px-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-semibold active:scale-95 transition"
                  >
                    Завтра
                  </button>
                  <button
                    onClick={() => applyMoveToDate(addDaysToIsoDate(moveModalTask.date, 2))}
                    class="py-2 px-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-semibold active:scale-95 transition"
                  >
                    Послезавтра
                  </button>
                  <button
                    onClick={() => applyMoveToDate(addDaysToIsoDate(moveModalTask.date, 7))}
                    class="py-2 px-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-semibold active:scale-95 transition"
                  >
                    +1 неделя
                  </button>
                </div>

                {/* Точный выбор даты */}
                <div class="space-y-1.5 pt-1">
                  <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Или конкретная дата:</label>
                  <input
                    type="date"
                    value={customDateInput}
                    onChange={(e) => setCustomDateInput(e.target.value)}
                    class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs font-mono font-bold text-slate-800 dark:text-slate-100 outline-none"
                  />
                </div>

                <div class="flex gap-2 pt-2">
                  <button
                    onClick={() => setMoveModalTask(null)}
                    class="flex-1 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-600 dark:text-slate-300 py-2.5 rounded-xl text-xs font-bold"
                  >
                    Отмена
                  </button>
                  <button
                    onClick={() => applyMoveToDate(customDateInput)}
                    class={`flex-1 ${theme.primary} text-white py-2.5 rounded-xl text-xs font-bold shadow-md active:scale-95 transition`}
                  >
                    Сохранить
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* НИЖНЯЯ ПАНЕЛЬ НАВИГАЦИИ */}
          <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 px-3 pt-2 pb-safe flex justify-around items-center z-40 transition-colors">
            <button
              onClick={() => setActiveTab('calendar')}
              class={`flex flex-col items-center gap-0.5 text-[11px] font-medium transition ${
                activeTab === 'calendar' ? `${theme.textAccent} font-bold` : 'text-slate-400 dark:text-slate-500'
              }`}
            >
              <span class="text-base">📅</span>
              Календарь
            </button>
            <button
              onClick={() => setActiveTab('kanban')}
              class={`flex flex-col items-center gap-0.5 text-[11px] font-medium transition ${
                activeTab === 'kanban' ? `${theme.textAccent} font-bold` : 'text-slate-400 dark:text-slate-500'
              }`}
            >
              <span class="text-base">📊</span>
              Неделя
            </button>
            <button
              onClick={() => setActiveTab('backlog')}
              class={`flex flex-col items-center gap-0.5 text-[11px] font-medium transition ${
                activeTab === 'backlog' ? `${theme.textAccent} font-bold` : 'text-slate-400 dark:text-slate-500'
              }`}
            >
              <span class="text-base">📝</span>
              Без даты
            </button>
            <button
              onClick={() => setActiveTab('recipes')}
              class={`flex flex-col items-center gap-0.5 text-[11px] font-medium transition ${
                activeTab === 'recipes' ? `${theme.textAccent} font-bold` : 'text-slate-400 dark:text-slate-500'
              }`}
            >
              <span class="text-base">📖</span>
              Рецепты
            </button>
            <button
              onClick={() => setActiveTab('cart')}
              class={`flex flex-col items-center gap-0.5 text-[11px] font-medium transition ${
                activeTab === 'cart' ? `${theme.textAccent} font-bold` : 'text-slate-400 dark:text-slate-500'
              }`}
            >
              <span class="text-base">🛒</span>
              Покупки
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<FamilyPlanner />);
  </script>
</body>
</html>


--
