    function triggerHaptic() {
      if (window.navigator && window.navigator.vibrate) {
        try { window.navigator.vibrate(15); } catch (e) {}
      }
    }

    function formatDateToDDMMYY(isoDateStr) {
      if (!isoDateStr) return '';
      const parts = isoDateStr.split('-');
      if (parts.length !== 3) return isoDateStr;
      return `${parts[2]}.${parts[1]}.${parts[0].slice(-2)}`;
    }

    function addDaysToIsoDate(isoDateStr, daysCount) {
      const [y, m, d] = isoDateStr.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      date.setDate(date.getDate() + daysCount);
      const resY = date.getFullYear();
      const resM = String(date.getMonth() + 1).padStart(2, '0');
      const resD = String(date.getDate()).padStart(2, '0');
      return `${resY}-${resM}-${resD}`;
    }

    function SwipeableTaskItem({ task, onToggle, onDelete, onMoveToTomorrow, onRequestDateModal, theme }) {
      const [dragX, setDragX] = useState(0);
      const touchStartX = useRef(0);
      const touchStartY = useRef(0);
      const isDragging = useRef(false);

      const handleTouchStart = (e) => {
        touchStartX.current = e.touches[0].clientX;
        touchStartY.current = e.touches[0].clientY;
        isDragging.current = true;
      };

      const handleTouchMove = (e) => {
        if (!isDragging.current) return;
        const diffX = e.touches[0].clientX - touchStartX.current;
        const diffY = e.touches[0].clientY - touchStartY.current;

        if (Math.abs(diffY) > Math.abs(diffX) && Math.abs(diffX) < 10) return;

        if (diffX > 140) setDragX(140);
        else if (diffX < -140) setDragX(-140);
        else setDragX(diffX);
      };

      const handleTouchEnd = () => {
        if (!isDragging.current) return;
        isDragging.current = false;

        if (dragX > 75) {
          triggerHaptic();
          onMoveToTomorrow(task);
        } else if (dragX < -75) {
          triggerHaptic();
          onRequestDateModal(task);
        }
        setDragX(0);
      };

      return (
        <div class="relative overflow-hidden rounded-2xl shadow-sm bg-slate-100 dark:bg-slate-800/80 select-none">
          <div class={`absolute inset-y-0 left-0 w-full bg-emerald-500 text-white flex items-center justify-start pl-4 font-bold text-xs gap-1.5 transition-opacity ${dragX > 20 ? 'opacity-100' : 'opacity-0'}`}>
            <span>→ На след. день</span>
          </div>

          <div class={`absolute inset-y-0 right-0 w-full bg-indigo-500 text-white flex items-center justify-end pr-4 font-bold text-xs gap-1.5 transition-opacity ${dragX < -20 ? 'opacity-100' : 'opacity-0'}`}>
            <span>Выбрать дату 📅</span>
          </div>

          <div
            onTouchStart={handleTouchStart}
            onTouchMove={handleTouchMove}
            onTouchEnd={handleTouchEnd}
            style={{ transform: `translateX(${dragX}px)`, transition: dragX === 0 ? 'transform 0.25s ease-out' : 'none' }}
            class={`relative flex items-center gap-2.5 p-3 bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 transition-colors ${
              task.done ? 'opacity-50 bg-slate-50/80 dark:bg-slate-900/60' : ''
            }`}
          >
            <button
              onClick={() => onToggle(task)}
              class={`w-6 h-6 rounded-lg border-2 flex items-center justify-center font-bold text-xs transition-all shrink-0 ${
                task.done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 dark:border-slate-600'
              }`}
            >
              {task.done && '✓'}
            </button>

            <div class="flex-1 min-w-0 flex items-center gap-2">
              {task.time && (
                <span class={`text-[11px] font-mono font-bold ${theme.textAccent} ${theme.cardBg} px-1.5 py-0.5 rounded-md shrink-0`}>
                  {task.time}
                </span>
              )}
              <p class={`text-xs font-medium leading-tight truncate ${task.done ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-800 dark:text-slate-100'}`}>
                {task.text}
              </p>
            </div>

            <span class={`text-[10px] font-bold px-2 py-0.5 rounded-md shrink-0 ${
              task.assignee === 'Рома' ? 'bg-sky-100 dark:bg-sky-950/80 text-sky-800 dark:text-sky-300' :
              task.assignee === 'Марина' ? 'bg-pink-100 dark:bg-pink-950/80 text-pink-700 dark:text-pink-300' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'
            }`}>
              {task.assignee}
            </span>

            <div class="hidden sm:flex items-center gap-1 shrink-0">
              <button
                onClick={() => onMoveToTomorrow(task)}

                📅

              ✕
            </button>
          </div>
        </div>
      );

    function FamilyPlanner() {
      const [activeTab, setActiveTab] = useState('calendar');
      const [currentUser, setCurrentUser] = useState(() => localStorage.getItem('fp_user') || 'Рома');
      const [selectedDate, setSelectedDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [calendarViewDate, setCalendarViewDate] = useState(() => new Date());

      const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('fp_dark_mode') === 'true');
      const [romaThemeKey, setRomaThemeKey] = useState(() => localStorage.getItem('fp_theme_roma') || 'blue');
      const [marinaThemeKey, setMarinaThemeKey] = useState(() => localStorage.getItem('fp_theme_marina') || 'pink');

      const [isOnline, setIsOnline] = useState(navigator.onLine);

      const [tasks, setTasks] = useState([]);
      const [backlogTasks, setBacklogTasks] = useState([]);
      const [scheduleEvents, setScheduleEvents] = useState([]);
      const [recipes, setRecipes] = useState([]);
      const [shoppingList, setShoppingList] = useState([]);
      const [activityLogs, setActivityLogs] = useState([]);
      const [categories, setCategories] = useState(() => {
        const saved = localStorage.getItem('fp_custom_categories');
        return saved ? JSON.parse(saved) : ['Спортзал', 'Врач', 'Встреча', 'Работа', 'Отдых', 'Другое'];
      });

      const [filterAssignee, setFilterAssignee] = useState('Все');
      const [isCalendarDoneOpen, setIsCalendarDoneOpen] = useState(false);
      const [isBacklogDoneOpen, setIsBacklogDoneOpen] = useState(false);

      const [moveModalTask, setMoveModalTask] = useState(null);
      const [customDateInput, setCustomDateInput] = useState('');

      const [recipeCategoryFilter, setRecipeCategoryFilter] = useState('Все');
      const [isQuickLinkOpen, setIsQuickLinkOpen] = useState(false);
      const [quickLinkUrl, setQuickLinkUrl] = useState('');
      const [quickLinkTitle, setQuickLinkTitle] = useState('');
      const [quickLinkCategory, setQuickLinkCategory] = useState('Обед');

      const [newTaskText, setNewTaskText] = useState('');
      const [newTaskTime, setNewTaskTime] = useState('');
      const [newTaskAssignee, setNewTaskAssignee] = useState('Общее');

      const [newBacklogText, setNewBacklogText] = useState('');
      const [newBacklogAssignee, setNewBacklogAssignee] = useState('Общее');

      const [kanbanTime, setKanbanTime] = useState('10:00');
      const [kanbanTitle, setKanbanTitle] = useState('');
      const [kanbanCategory, setKanbanCategory] = useState(categories[0] || 'Спортзал');
      const [kanbanAssignee, setKanbanAssignee] = useState('Общее');

      const [newShopItem, setNewShopItem] = useState('');
      const [newCustomCategoryInput, setNewCustomCategoryInput] = useState('');

      const [isRecipeModalOpen, setIsRecipeModalOpen] = useState(false);
      const [recipeForm, setRecipeForm] = useState({
        title: '',
        category: 'Обед',
        time: '',
        ingredientsText: '',
        steps: '',
        url: ''
      });

      const currentThemeKey = currentUser === 'Рома' ? romaThemeKey : marinaThemeKey;
      const theme = THEME_PALETTES[currentThemeKey] || THEME_PALETTES.blue;

      useEffect(() => {
        if (isDarkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        localStorage.setItem('fp_dark_mode', isDarkMode);
      }, [isDarkMode]);

      const toggleDarkMode = () => {
        setIsDarkMode(prev => !prev);
      };

      const setAndSaveUserTheme = (colorKey) => {
        if (currentUser === 'Рома') {
          setRomaThemeKey(colorKey);
          localStorage.setItem('fp_theme_roma', colorKey);
        } else {
          setMarinaThemeKey(colorKey);
          localStorage.setItem('fp_theme_marina', colorKey);
        }
      };

      const toggleUserRole = () => {
        const nextUser = currentUser === 'Рома' ? 'Марина' : 'Рома';
        setCurrentUser(nextUser);
        localStorage.setItem('fp_user', nextUser);
      };

      const logActivity = async (actionText) => {
        try {
          const logEntry = {
            id: Date.now().toString() + '_' + Math.random().toString(36).substring(2, 6),
            user_name: currentUser,
            action_text: actionText
          };
          setActivityLogs((prev) => [logEntry, ...prev]);
          await supabase.from('activity_log').insert([logEntry]);
        } catch (e) {
          console.error("Ошибка логирования:", e);
        }
      };

      const fetchData = async () => {
        try {
          const [tRes, bRes, sRes, rRes, shRes, aRes] = await Promise.all([
            supabase.from('tasks').select('*').order('created_at', { ascending: false }),
            supabase.from('backlog').select('*').order('created_at', { ascending: false }),
            supabase.from('schedule').select('*').order('time', { ascending: true }),
            supabase.from('recipes').select('*').order('id', { ascending: false }),
            supabase.from('shopping').select('*').order('created_at', { ascending: false }),
            supabase.from('activity_log').select('*').order('created_at', { ascending: false }).limit(40)
          ]);

          if (tRes.data) setTasks(tRes.data);
          if (bRes.data) setBacklogTasks(bRes.data);
          if (sRes.data) setScheduleEvents(sRes.data);
          if (rRes.data) setRecipes(rRes.data);
          if (shRes.data) setShoppingList(shRes.data);
          if (aRes.data) setActivityLogs(aRes.data);
        } catch (err) {
          console.error("Ошибка загрузки:", err);
        }
      };

      useEffect(() => {
        fetchData();

        const handleOnline = () => setIsOnline(true);
        const handleOffline = () => setIsOnline(false);
        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);

        const channel = supabase
          .channel('schema-db-all-sync-v3')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, () => {
            supabase.from('tasks').select('*').then(res => res.data && setTasks(res.data));
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'backlog' }, () => {
            supabase.from('backlog').select('*').then(res => res.data && setBacklogTasks(res.data));
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'schedule' }, () => {
            supabase.from('schedule').select('*').order('time', { ascending: true }).then(res => res.data && setScheduleEvents(res.data));
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'recipes' }, () => {
            supabase.from('recipes').select('*').order('id', { ascending: false }).then(res => res.data && setRecipes(res.data));
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'shopping' }, () => {
            supabase.from('shopping').select('*').then(res => res.data && setShoppingList(res.data));
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'activity_log' }, () => {
            supabase.from('activity_log').select('*').order('created_at', { ascending: false }).limit(40).then(res => res.data && setActivityLogs(res.data));
          })
          .subscribe();

        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
          supabase.removeChannel(channel);
        };
      }, []);

      const calendarDays = useMemo(() => {
        const year = calendarViewDate.getFullYear();
        const month = calendarViewDate.getMonth();
        const firstDayOfMonth = new Date(year, month, 1);
        const lastDayOfMonth = new Date(year, month + 1, 0);

        let startingDay = firstDayOfMonth.getDay() - 1;
        if (startingDay === -1) startingDay = 6;

        const days = [];
        for (let i = 0; i < startingDay; i++) days.push(null);
        for (let d = 1; d <= lastDayOfMonth.getDate(); d++) {
          const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          days.push({ dayNumber: d, isoDate: iso });
        }
        return days;
      }, [calendarViewDate]);

      const changeMonth = (offset) => {
        setCalendarViewDate(new Date(calendarViewDate.getFullYear(), calendarViewDate.getMonth() + offset, 1));
      };

      const monthName = calendarViewDate.toLocaleString('ru-RU', { month: 'long', year: 'numeric' });

      const currentWeekDays = useMemo(() => {
        const curr = new Date(selectedDate);
        const day = curr.getDay();
        const diff = curr.getDate() - day + (day === 0 ? -6 : 1);
        const monday = new Date(curr.setDate(diff));

        const week = [];
        const dayNames = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
        for (let i = 0; i < 7; i++) {
          const nextDay = new Date(monday);
          nextDay.setDate(monday.getDate() + i);
          const iso = nextDay.toISOString().split('T')[0];
          week.push({
            name: dayNames[i],
            dateStr: formatDateToDDMMYY(iso),
            isoDate: iso,
            dayNum: nextDay.getDate()
          });
        }
        return week;
      }, [selectedDate]);

      const shiftWeek = (offsetDays) => {
        const d = new Date(selectedDate);
        d.setDate(d.getDate() + offsetDays);
        setSelectedDate(d.toISOString().split('T')[0]);
      };

      const goToCurrentWeek = () => {
        const todayIso = new Date().toISOString().split('T')[0];
        setSelectedDate(todayIso);
        setCalendarViewDate(new Date());
      };

      const moveTaskToTomorrow = async (task) => {
        const nextDayIso = addDaysToIsoDate(task.date, 1);
        setTasks(tasks.map(t => t.id === task.id ? { ...t, date: nextDayIso } : t));
        logActivity(`перенес(ла) на завтра: "${task.text}"`);
        await supabase.from('tasks').update({ date: nextDayIso }).eq('id', task.id);
      };

      const applyMoveToDate = async (newDateIso) => {
        if (!moveModalTask || !newDateIso) return;
        const task = moveModalTask;
        setTasks(tasks.map(t => t.id === task.id ? { ...t, date: newDateIso } : t));
        logActivity(`перенес(ла) на ${formatDateToDDMMYY(newDateIso)}: "${task.text}"`);
        setMoveModalTask(null);
        await supabase.from('tasks').update({ date: newDateIso }).eq('id', task.id);
      };

      const toggleTask = async (task) => {
        triggerHaptic();
        const nextDone = !task.done;
        setTasks(tasks.map(t => t.id === task.id ? { ...t, done: nextDone } : t));
        logActivity(`${nextDone ? 'выполнил(а)' : 'вернул(а) в работу'}: "${task.text}"`);
        await supabase.from('tasks').update({ done: nextDone }).eq('id', task.id);
      };

      const addTask = async (e) => {
        e.preventDefault();
        if (!newTaskText.trim()) return;
        const newTask = {
          id: Date.now().toString(),
          text: newTaskText.trim(),
          time: newTaskTime || null,
          date: selectedDate,
          assignee: newTaskAssignee,
          done: false
        };
        setTasks([newTask, ...tasks]);
        setNewTaskText('');
        setNewTaskTime('');
        logActivity(`добавил(а) задачу: "${newTask.text}"`);
        await supabase.from('tasks').insert([newTask]);
      };

      const deleteTask = async (id) => {
        const t = tasks.find(item => item.id === id);
        setTasks(tasks.filter(item => item.id !== id));
        if (t) logActivity(`удалил(а) задачу: "${t.text}"`);
        await supabase.from('tasks').delete().eq('id', id);
      };

      const toggleScheduleEvent = async (ev) => {
        triggerHaptic();
        const nextDone = !ev.done;
        setScheduleEvents(scheduleEvents.map(s => s.id === ev.id ? { ...s, done: nextDone } : s));
        logActivity(`${nextDone ? 'выполнил(а)' : 'вернул(а)'} событие: "${ev.title}"`);
        await supabase.from('schedule').update({ done: nextDone }).eq('id', ev.id);
      };

      const addScheduleEvent = async (e) => {
        e.preventDefault();
        if (!kanbanTitle.trim()) return;
        const newEv = {
          id: Date.now().toString(),
          title: kanbanTitle.trim(),
          time: kanbanTime,
          date: selectedDate,
          category: kanbanCategory,
          assignee: kanbanAssignee,
          done: false
        };
        setScheduleEvents([...scheduleEvents, newEv]);
        setKanbanTitle('');
        logActivity(`добавил(а) в расписание: "${newEv.title}" на ${newEv.time}`);
        await supabase.from('schedule').insert([newEv]);
      };

      const deleteScheduleEvent = async (id) => {
        setScheduleEvents(scheduleEvents.filter(s => s.id !== id));
        await supabase.from('schedule').delete().eq('id', id);
      };

      const toggleBacklog = async (task) => {
        triggerHaptic();
        const nextDone = !task.done;
        setBacklogTasks(backlogTasks.map(t => t.id === task.id ? { ...t, done: nextDone } : t));
        logActivity(`${nextDone ? 'выполнил(а)' : 'вернул(а)'} из списка без даты: "${task.text}"`);
        await supabase.from('backlog').update({ done: nextDone }).eq('id', task.id);
      };

      const addBacklogTask = async (e) => {
        e.preventDefault();
        if (!newBacklogText.trim()) return;
        const newTask = {
          id: Date.now().toString(),
          text: newBacklogText.trim(),
          assignee: newBacklogAssignee,
          done: false
        };
        setBacklogTasks([newTask, ...backlogTasks]);
        setNewBacklogText('');
        logActivity(`добавил(а) задачу без даты: "${newTask.text}"`);
        await supabase.from('backlog').insert([newTask]);
      };

      const deleteBacklogTask = async (id) => {
        setBacklogTasks(backlogTasks.filter(t => t.id !== id));
        await supabase.from('backlog').delete().eq('id', id);
      };

      const handleQuickLinkSubmit = async (e) => {
        e.preventDefault();
        if (!quickLinkUrl.trim()) return;

        let formattedUrl = quickLinkUrl.trim();
        if (!formattedUrl.startsWith('http://') && !formattedUrl.startsWith('https://')) {
          formattedUrl = 'https://' + formattedUrl;
        }

        const domainName = formattedUrl.replace('https://', '').replace('http://', '').split('/')[0];
        const title = quickLinkTitle.trim() || `Рецепт с ${domainName}`;

        const newRec = {
          id: Date.now().toString(),
          title: title,
          category: quickLinkCategory,
          sourceurl: formattedUrl,
          sourceUrl: formattedUrl,
          source: domainName,
          ingredients: [],
          steps: null,
          time: null
        };

        setRecipes([newRec, ...recipes]);
        setQuickLinkUrl('');
        setQuickLinkTitle('');
        setIsQuickLinkOpen(false);
        logActivity(`сохранил(а) ссылку на рецепт: "${title}"`);
        await supabase.from('recipes').insert([newRec]);
      };

      const handleAddCustomRecipe = async (e) => {
        e.preventDefault();
        if (!recipeForm.title.trim()) return;

        const ingredientsArr = recipeForm.ingredientsText
          .split('\n')
          .map(i => i.trim())
          .filter(Boolean);

        let url = recipeForm.url.trim();
        if (url && !url.startsWith('http://') && !url.startsWith('https://')) {
          url = 'https://' + url;
        }

        const newRecipe = {
          id: Date.now().toString(),
          title: recipeForm.title.trim(),
          category: recipeForm.category,
          time: recipeForm.time || null,
          sourceurl: url || null,
          sourceUrl: url || null,
          ingredients: ingredientsArr,
          steps: recipeForm.steps.trim() || null
        };

        setRecipes([newRecipe, ...recipes]);
        setIsRecipeModalOpen(false);
        setRecipeForm({ title: '', category: 'Обед', time: '', ingredientsText: '', steps: '', url: '' });
        logActivity(`добавил(а) рецепт: "${newRecipe.title}"`);
        await supabase.from('recipes').insert([newRecipe]);
      };

      const deleteRecipe = async (id) => {
        setRecipes(recipes.filter(r => r.id !== id));
        await supabase.from('recipes').delete().eq('id', id);
      };

      const addIngredientsToCart = async (ingredients) => {
        if (!ingredients || !ingredients.length) return;
        const newItems = ingredients.map(ing => ({
          id: Math.random().toString(),
          text: ing,
          done: false
        }));
        setShoppingList([...newItems, ...shoppingList]);
        alert('Ингредиенты добавлены в покупки!');
        logActivity(`добавил(а) ингредиенты в список покупок (${ingredients.length} шт.)`);
        await supabase.from('shopping').insert(newItems);
      };

      const toggleShopItem = async (item) => {
        triggerHaptic();
        const nextDone = !item.done;
        setShoppingList(shoppingList.map(s => s.id === item.id ? { ...s, done: nextDone } : s));
        logActivity(`${nextDone ? 'купил(а)' : 'вернул(а) в покупки'}: "${item.text}"`);
        await supabase.from('shopping').update({ done: nextDone }).eq('id', item.id);
      };

      const addShopItem = async (e) => {
        e.preventDefault();
        if (!newShopItem.trim()) return;
        const newItem = { id: Date.now().toString(), text: newShopItem.trim(), done: false };
        setShoppingList([newItem, ...shoppingList]);
        setNewShopItem('');
        logActivity(`добавил(а) продукт: "${newItem.text}"`);
        await supabase.from('shopping').insert([newItem]);
      };

      const deleteShopItem = async (id, e) => {
        e.stopPropagation();
        setShoppingList(shoppingList.filter(s => s.id !== id));
        await supabase.from('shopping').delete().eq('id', id);
      };

      const clearCompletedShopping = async () => {
        const completedIds = shoppingList.filter(i => i.done).map(i => i.id);
        if (!completedIds.length) return;
        setShoppingList(shoppingList.filter(i => !i.done));
        logActivity(`очистил(а) купленные продукты (${completedIds.length} шт.)`);
        for (const id of completedIds) {
          await supabase.from('shopping').delete().eq('id', id);
        }
      };

      const addStandardGroceryKit = async () => {
        const defaultKit = ['Молоко', 'Яйца (десяток)', 'Хлеб', 'Сливочное масло', 'Сыр твердый'];
        const newItems = defaultKit.map(name => ({
          id: Math.random().toString(),
          text: name,
          done: false
        }));
        setShoppingList([...newItems, ...shoppingList]);
        alert('Базовый набор продуктов добавлен в покупки!');
        logActivity('добавил(а) стандартный набор продуктов на неделю');
        await supabase.from('shopping').insert(newItems);
      };

      const handleAddCategory = (e) => {
        e.preventDefault();
        if (!newCustomCategoryInput.trim()) return;
        const updated = [...categories, newCustomCategoryInput.trim()];
        setCategories(updated);
        localStorage.setItem('fp_custom_categories', JSON.stringify(updated));
        setNewCustomCategoryInput('');
      };

      const handleDeleteCategory = (catToDelete) => {
        if (categories.length <= 1) return;
        const updated = categories.filter(c => c !== catToDelete);
        setCategories(updated);
        localStorage.setItem('fp_custom_categories', JSON.stringify(updated));
      };

      const exportFamilyDataBackup = () => {
        const data = { tasks, backlogTasks, scheduleEvents, recipes, shoppingList, exportDate: new Date().toISOString() };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `planner-backup-${formatDateToDDMMYY(selectedDate)}.json`;
        a.click();
      };

      const { activeCalendarTasks, doneCalendarTasks } = useMemo(() => {
        const dayFiltered = tasks
          .filter(t => {
            const matchesDate = t.date === selectedDate;
            const matchesAssignee = filterAssignee === 'Все' || t.assignee === filterAssignee;
            return matchesDate && matchesAssignee;
          })
          .sort((a, b) => {
            if (a.time && b.time) return a.time.localeCompare(b.time);
            if (a.time) return -1;
            if (b.time) return 1;
            return 0;
          });

        return {
          activeCalendarTasks: dayFiltered.filter(t => !t.done),
          doneCalendarTasks: dayFiltered.filter(t => t.done)
        };
      }, [tasks, selectedDate, filterAssignee]);

      const { activeBacklogTasks, doneBacklogTasks } = useMemo(() => {
        const filtered = backlogTasks.filter(t => filterAssignee === 'Все' || t.assignee === filterAssignee);
        return {
          activeBacklogTasks: filtered.filter(t => !t.done),
          doneBacklogTasks: filtered.filter(t => t.done)
        };
      }, [backlogTasks, filterAssignee]);

      const currentSchedule = useMemo(() => {
        return scheduleEvents.filter(s => {
          const matchesDate = s.date === selectedDate;
          const matchesAssignee = filterAssignee === 'Все' || s.assignee === filterAssignee;
          return matchesDate && matchesAssignee;
        });
      }, [scheduleEvents, selectedDate, filterAssignee]);

      const filteredRecipes = useMemo(() => {
        if (recipeCategoryFilter === 'Все') return recipes;
        return recipes.filter(r => r.category === recipeCategoryFilter);
      }, [recipes, recipeCategoryFilter]);

      return (
        <div class="max-w-md mx-auto min-h-screen bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex flex-col justify-between pb-28 transition-colors duration-200">
          <div>
            {/* ШАПКА */}
            <header class={`${theme.primary} text-white pt-safe px-4 pb-3 sticky top-0 z-30 shadow-md transition-colors duration-300`}>
              <div class="flex items-center justify-between gap-2 pt-2">
                <div class="min-w-0">
                  <div class="flex items-center gap-1.5">
                    <span class="inline-flex items-center justify-center w-6 h-6 rounded-lg bg-white/25 font-black text-[11px] tracking-tight">
                      Р|М
                    </span>
                    <h1 class="text-base font-bold tracking-tight">Рома & Марина</h1>
                    <span class="text-[9px] px-1.5 py-0.5 rounded-full bg-white/20 font-medium">
                      {isOnline ? '🟢 Онлайн' : '🔴 Офлайн'}
                    </span>
                  </div>
                  <div class="flex items-center gap-1.5 mt-0.5">
                    <span class="text-[11px] text-white/90">Роль:</span>
                    <button 
                      onClick={toggleUserRole}
                      class="text-[11px] font-bold bg-white/20 hover:bg-white/30 px-2 py-0.5 rounded-full border border-white/30 active:scale-95 transition"
                    >
                      {currentUser} ⇄
                    </button>
                  </div>
                </div>

                <div class="flex items-center gap-1.5 shrink-0">
                  <div class={`flex items-center ${theme.badge} px-2.5 py-1.5 rounded-xl border shadow-inner`}>
                    <span class="text-xs font-mono font-bold tracking-wider text-white">
                      {formatDateToDDMMYY(selectedDate)}
                    </span>
                  </div>
                  <button
                    onClick={() => setActiveTab('settings')}
                    class="w-8 h-8 rounded-xl bg-white/20 hover:bg-white/30 flex items-center justify-center text-sm border border-white/30 active:scale-95 transition"
                    title="Настройки"
                  >
                    ⚙️
                  </button>
                </div>
              </div>
            </header>

            {/* ВКЛАДКА 1: КАЛЕНДАРЬ */}
            {activeTab === 'calendar' && (
              <main class="p-4 space-y-3.5">
                <div class="bg-white dark:bg-slate-900 rounded-2xl p-3.5 shadow-sm border border-slate-100 dark:border-slate-800">
                  <div class="flex justify-between items-center mb-3">
                    <h2 class="text-xs font-bold text-slate-800 dark:text-slate-100 uppercase tracking-wider capitalize">
                      {monthName}
                    </h2>
                    <div class="flex gap-1.5">
                      <button onClick={() => changeMonth(-1)} class="w-7 h-7 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg flex items-center justify-center font-bold text-xs">
                        ‹
                      </button>
                      <button onClick={() => { setCalendarViewDate(new Date()); setSelectedDate(new Date().toISOString().split('T')[0]); }} class={`px-2 h-7 ${theme.btnLight} rounded-lg text-xs font-semibold`}>
                        Сегодня
                      </button>
                      <button onClick={() => changeMonth(1)} class="w-7 h-7 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg flex items-center justify-center font-bold text-xs">
                        ›
                      </button>
                    </div>
                  </div>

                  <div class="grid grid-cols-7 text-center text-[10px] font-bold text-slate-400 dark:text-slate-500 mb-1">
                    <span>ПН</span><span>ВТ</span><span>СР</span><span>ЧТ</span><span>ПТ</span><span>СБ</span><span>ВС</span>
                  </div>

                  <div class="grid grid-cols-7 gap-1">
                    {calendarDays.map((item, idx) => {
                      if (!item) return <div key={idx} class="h-9"></div>;

                      const isSelected = item.isoDate === selectedDate;
                      const isToday = item.isoDate === new Date().toISOString().split('T')[0];
                      
                      const dayTasks = tasks.filter(t => t.date === item.isoDate);
                      const dayEvents = scheduleEvents.filter(s => s.date === item.isoDate);
                      const hasUndone = dayTasks.some(t => !t.done) || dayEvents.some(s => !s.done);
                      const hasDone = dayTasks.some(t => t.done) || dayEvents.some(s => s.done);

                      return (
                        <button
                          key={idx}
                          onClick={() => setSelectedDate(item.isoDate)}
                          class={`h-9 rounded-xl flex flex-col items-center justify-center relative transition ${
                            isSelected 
                              ? `${theme.activeBtn} font-bold shadow-sm` 
                              : isToday 
                              ? `${theme.activePill} font-bold border` 
                              : 'text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'
                          }`}
                        >
                          <span class="text-xs leading-none">{item.dayNumber}</span>
                          {(dayTasks.length > 0 || dayEvents.length > 0) && (
                            <div class="flex gap-0.5 mt-1">
                              {hasUndone && <span class={`w-1 h-1 rounded-full ${isSelected ? 'bg-white' : 'bg-pink-400'}`}></span>}
                              {hasDone && <span class={`w-1 h-1 rounded-full ${isSelected ? 'bg-white/70' : 'bg-emerald-500'}`}></span>}
                            </div>
                          )}
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div class="grid grid-cols-4 gap-1 bg-slate-200/80 dark:bg-slate-800/80 p-1 rounded-xl text-xs font-semibold">
                  {['Все', 'Рома', 'Марина', 'Общее'].map((tab) => (
                    <button
                      key={tab}
                      onClick={() => setFilterAssignee(tab)}
                      class={`py-1.5 rounded-lg transition-all text-center ${
                        filterAssignee === tab ? `bg-white dark:bg-slate-900 ${theme.textAccent} shadow-sm font-bold` : 'text-slate-600 dark:text-slate-400'
                      }`}
                    >
                      {tab}
                    </button>
                  ))}
                </div>

                <form onSubmit={addTask} class="bg-white dark:bg-slate-900 p-2.5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 space-y-2">
                  <div class="flex gap-2">
                    <input
                      type="time"
                      value={newTaskTime}
                      onChange={(e) => setNewTaskTime(e.target.value)}
                      class="bg-slate-100 dark:bg-slate-800 rounded-xl px-2.5 py-1.5 text-xs font-bold text-slate-700 dark:text-slate-200 outline-none"
                    />
                    <input
                      type="text"
                      placeholder="Дело на день..."
                      value={newTaskText}
                      onChange={(e) => setNewTaskText(e.target.value)}
                      class="flex-1 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-1.5 text-xs outline-none focus:border-indigo-500 text-slate-800 dark:text-slate-100 placeholder-slate-400"
                    />
                  </div>
                  <div class="flex gap-2 justify-between items-center">
                    <span class="text-[11px] text-slate-400 pl-1">
                      {newTaskTime ? `Время: ${newTaskTime}` : 'Без времени'}
                    </span>
                    <div class="flex gap-2">
                      <select
                        value={newTaskAssignee}
                        onChange={(e) => setNewTaskAssignee(e.target.value)}
                        class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-medium rounded-xl px-2.5 py-1.5 text-slate-700 dark:text-slate-200 outline-none"
                      >
                        <option value="Общее">Оба</option>
                        <option value="Рома">Рома</option>
                        <option value="Марина">Марина</option>
                      </select>
                      <button type="submit" class={`${theme.primary} text-white px-4 py-1.5 rounded-xl text-xs font-bold active:scale-95 transition`}>
                        + Добавить
                      </button>
                    </div>
                  </div>
                </form>

                {currentSchedule.length > 0 && (
                  <div class="space-y-2">
                    <h3 class={`text-[11px] font-bold ${theme.textAccent} uppercase tracking-wider px-1`}>
                      🕒 Недельный таймлайн ({currentSchedule.length})
                    </h3>
                    <div class="space-y-1.5">
                      {currentSchedule.map(ev => (
                        <div key={ev.id} class={`flex items-center justify-between p-2.5 ${theme.cardBg} rounded-2xl transition ${
                          ev.done ? 'opacity-50 line-through bg-slate-100 dark:bg-slate-900/60' : ''
                        }`}>
                          <div class="flex items-center gap-2 min-w-0">
                            <button
                              onClick={() => toggleScheduleEvent(ev)}
                              class={`w-5 h-5 rounded-md border flex items-center justify-center font-bold text-[10px] shrink-0 ${
                                ev.done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800'
                              }`}
                            >
                              {ev.done && '✓'}
                            </button>
                            <span class={`text-xs font-mono font-bold ${theme.textAccent} bg-white dark:bg-slate-800 px-1.5 py-0.5 rounded-md shadow-xs shrink-0`}>
                              {ev.time}
                            </span>
                            <span class={`text-xs font-semibold truncate ${ev.done ? 'text-slate-400 dark:text-slate-500' : 'text-slate-800 dark:text-slate-100'}`}>
                              {ev.title}
                            </span>
                          </div>
                          <div class="flex items-center gap-1.5 shrink-0">
                            <span class="text-[9px] text-slate-500 dark:text-slate-400 font-medium">{ev.category}</span>
                            <span class={`text-[9px] font-bold px-1.5 py-0.2 rounded ${
                              ev.assignee === 'Рома' ? 'bg-sky-100 dark:bg-sky-950/80 text-sky-800 dark:text-sky-300' :
                              ev.assignee === 'Марина' ? 'bg-pink-100 dark:bg-pink-950/80 text-pink-700 dark:text-pink-300' : 'bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300'
                            }`}>
                              {ev.assignee}
                            </span>
                            <button onClick={() => deleteScheduleEvent(ev.id)} class="text-slate-300 dark:text-slate-600 hover:text-rose-500 text-xs p-1">✕</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                <div class="space-y-2">
                  <div class="flex justify-between items-center px-1">
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">
                      Задачи ({activeCalendarTasks.length})
                    </h2>
                    <span class="text-[10px] text-slate-400">Свайп: ➔ Завтра | 📅 Дата ⬅</span>
                  </div>

                  {activeCalendarTasks.length === 0 && currentSchedule.length === 0 && doneCalendarTasks.length === 0 ? (
                    <div class="text-center py-6 bg-white dark:bg-slate-900 rounded-2xl border border-dashed border-slate-200 dark:border-slate-800 text-slate-400 text-xs">
                      Нет дел на {formatDateToDDMMYY(selectedDate)} ☕
                    </div>
                  ) : (
                    activeCalendarTasks.map((task) => (
                      <SwipeableTaskItem
                        key={task.id}
                        task={task}
                        onToggle={toggleTask}
                        onDelete={deleteTask}
                        onMoveToTomorrow={moveTaskToTomorrow}
                        onRequestDateModal={(t) => { setMoveModalTask(t); setCustomDateInput(t.date || selectedDate); }}
                        theme={theme}
                      />
                    ))
                  )}

                  {doneCalendarTasks.length > 0 && (
                    <div class="pt-2 border-t border-slate-200/60 dark:border-slate-800">
                      <button
                        onClick={() => setIsCalendarDoneOpen(!isCalendarDoneOpen)}
                        class="w-full flex items-center justify-between py-2 px-2 text-xs font-bold text-slate-500 dark:text-slate-400 hover:text-slate-700 transition"
                      >
                        <span class="flex items-center gap-1.5">
                          <span>✓</span>
                          <span>Выполнено ({doneCalendarTasks.length})</span>
                        </span>
                        <span class="text-[10px] transform transition-transform duration-200">{isCalendarDoneOpen ? '▲' : '▼'}</span>
                      </button>

                      {isCalendarDoneOpen && (
                        <div class="space-y-2 pt-1">
                          {doneCalendarTasks.map((task) => (
                            <SwipeableTaskItem
                              key={task.id}
                              task={task}
                              onToggle={toggleTask}
                              onDelete={deleteTask}
                              onMoveToTomorrow={moveTaskToTomorrow}
                              onRequestDateModal={(t) => { setMoveModalTask(t); setCustomDateInput(t.date || selectedDate); }}
                              theme={theme}
                            />
                          ))}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </main>
            )}

            {/* ВКЛАДКА 2: КАНБАН */}
            {activeTab === 'kanban' && (
              <main class="p-4 space-y-4">
                <div class="flex justify-between items-center px-1">
                  <div>
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Недельный таймлайн</h2>
                    <p class="text-[11px] text-slate-500">График по часам</p>
                  </div>
                  <div class="flex items-center gap-1">
                    <button 
                      onClick={() => shiftWeek(-7)} 
                      class="w-7 h-7 bg-white dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-lg flex items-center justify-center font-bold text-xs border border-slate-200 dark:border-slate-700 active:scale-95"
                    >
                      ‹
                    </button>
                    <button 
                      onClick={goToCurrentWeek}
                      class={`text-xs font-bold ${theme.btnLight} px-2.5 py-1.5 rounded-lg active:scale-95 transition flex items-center gap-1`}
                    >
                      <span>📅</span> Сегодня
                    </button>
                    <button 
                      onClick={() => shiftWeek(7)} 
                      class="w-7 h-7 bg-white dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-lg flex items-center justify-center font-bold text-xs border border-slate-200 dark:border-slate-700 active:scale-95"
                    >
                      ›
                    </button>
                  </div>
                </div>

                <form onSubmit={addScheduleEvent} class="bg-white dark:bg-slate-900 p-3 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 space-y-2">
                  <div class="flex gap-2">
                    <input
                      type="time"
                      value={kanbanTime}
                      onChange={(e) => setKanbanTime(e.target.value)}
                      class="bg-slate-100 dark:bg-slate-800 rounded-xl px-2.5 py-1.5 text-xs font-bold text-slate-700 dark:text-slate-200 outline-none"
                    />
                    <input
                      type="text"
                      placeholder="Врач, тренировка, встреча..."
                      value={kanbanTitle}
                      onChange={(e) => setKanbanTitle(e.target.value)}
                      class="flex-1 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-1.5 text-xs outline-none focus:border-indigo-500 text-slate-800 dark:text-slate-100 placeholder-slate-400"
                    />
                  </div>
                  <div class="flex gap-2">
                    <select
                      value={kanbanCategory}
                      onChange={(e) => setKanbanCategory(e.target.value)}
                      class="flex-1 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs rounded-xl px-2 py-1.5 text-slate-700 dark:text-slate-200 outline-none"
                    >
                      {categories.map((cat, i) => (
                        <option key={i} value={cat}>{cat}</option>
                      ))}
                    </select>
                    <select
                      value={kanbanAssignee}
                      onChange={(e) => setKanbanAssignee(e.target.value)}
                      class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs rounded-xl px-2 py-1.5 text-slate-700 dark:text-slate-200 outline-none"
                    >
                      <option value="Общее">Оба</option>
                      <option value="Рома">Рома</option>
                      <option value="Марина">Марина</option>
                    </select>
                    <button type="submit" class={`${theme.primary} text-white px-4 py-1.5 rounded-xl text-xs font-bold active:scale-95`}>
                      + В график
                    </button>
                  </div>
                </form>

                <div class="flex gap-3 overflow-x-auto no-scrollbar pb-2 pt-1 -mx-4 px-4 snap-x">
                  {currentWeekDays.map((col) => {
                    const isSelected = col.isoDate === selectedDate;
                    const dayEvents = scheduleEvents.filter(s => s.date === col.isoDate && (filterAssignee === 'Все' || s.assignee === filterAssignee));
                    const dayTasks = tasks.filter(t => t.date === col.isoDate && (filterAssignee === 'Все' || t.assignee === filterAssignee));
                    const totalItems = dayEvents.length + dayTasks.length;

                    return (
                      <div 
                        key={col.isoDate} 
                        onClick={() => setSelectedDate(col.isoDate)}
                        class={`min-w-[220px] w-[220px] shrink-0 bg-white dark:bg-slate-900 rounded-2xl p-3 shadow-sm border transition snap-start flex flex-col justify-between cursor-pointer ${
                          isSelected ? 'border-2 border-slate-400 dark:border-slate-500' : 'border-slate-100 dark:border-slate-800'
                        }`}
                      >
                        <div>
                          <div class="flex justify-between items-center pb-2 border-b border-slate-100 dark:border-slate-800">
                            <div>
                              <span class="text-xs font-bold text-slate-700 dark:text-slate-200">{col.name}</span>
                              <span class="text-[10px] text-slate-400 ml-1.5 font-mono">{col.dateStr}</span>
                            </div>
                            <span class={`text-[10px] font-bold px-1.5 py-0.5 rounded-full ${isSelected ? theme.primary + ' text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400'}`}>
                              {totalItems}
                            </span>
                          </div>

                          <div class="mt-2.5 space-y-2 min-h-[140px]">
                            {dayEvents.map(ev => (
                              <div key={ev.id} class={`p-2 rounded-xl border transition ${
                                ev.done ? 'bg-slate-100/80 dark:bg-slate-800/50 border-slate-200 dark:border-slate-700 opacity-60' : theme.cardBg
                              }`}>
                                <div class="flex items-center justify-between">
                                  <div class="flex items-center gap-1.5">
                                    <button
                                      onClick={(e) => { e.stopPropagation(); toggleScheduleEvent(ev); }}
                                      class={`w-4 h-4 rounded border flex items-center justify-center font-bold text-[9px] ${
                                        ev.done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800'
                                      }`}
                                    >
                                      {ev.done && '✓'}
                                    </button>
                                    <span class={`text-[10px] font-mono font-bold ${theme.textAccent} bg-white dark:bg-slate-800 px-1 rounded shadow-2xs`}>
                                      {ev.time}
                                    </span>
                                  </div>
                                  <span class={`text-[9px] font-bold px-1.5 py-0.2 rounded ${
                                    ev.assignee === 'Рома' ? 'bg-sky-100 dark:bg-sky-950/80 text-sky-800 dark:text-sky-300' :
                                    ev.assignee === 'Марина' ? 'bg-pink-100 dark:bg-pink-950/80 text-pink-700 dark:text-pink-300' : 'bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300'
                                  }`}>
                                    {ev.assignee}
                                  </span>
                                </div>
                                <p class={`text-xs font-semibold mt-1 leading-tight ${ev.done ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-800 dark:text-slate-100'}`}>
                                  {ev.title}
                                </p>
                                <div class="flex justify-between items-center mt-1">
                                  <span class="text-[9px] text-slate-500 dark:text-slate-400 font-medium">{ev.category}</span>
                                  <button 
                                    onClick={(e) => { e.stopPropagation(); deleteScheduleEvent(ev.id); }}
                                    class="text-slate-300 dark:text-slate-600 hover:text-rose-500 text-[10px]"
                                  >
                                    ✕
                                  </button>
                                </div>
                              </div>
                            ))}

                            {dayTasks.map(t => (
                              <div key={t.id} class="bg-slate-50 dark:bg-slate-800/80 p-2 rounded-xl border border-slate-100 dark:border-slate-700/60 flex items-center justify-between gap-1.5">
                                <div class="flex items-center gap-1.5 min-w-0">
                                  <button
                                    onClick={(e) => { e.stopPropagation(); toggleTask(t); }}
                                    class={`w-4 h-4 rounded border flex items-center justify-center font-bold text-[9px] shrink-0 ${
                                      t.done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800'
                                    }`}
                                  >
                                    {t.done && '✓'}
                                  </button>
                                  {t.time && (
                                    <span class={`text-[9px] font-mono font-bold ${theme.textAccent} bg-white dark:bg-slate-800 px-1 rounded shrink-0`}>
                                      {t.time}
                                    </span>
                                  )}
                                  <span class={`text-xs leading-tight truncate ${t.done ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-700 dark:text-slate-200'}`}>
                                    {t.text}
                                  </span>
                                </div>
                                <span class={`text-[8px] font-bold px-1 rounded shrink-0 ${
                                  t.assignee === 'Рома' ? 'bg-sky-100 dark:bg-sky-950/80 text-sky-800 dark:text-sky-300' :
                                  t.assignee === 'Марина' ? 'bg-pink-100 dark:bg-pink-950/80 text-pink-700 dark:text-pink-300' : 'bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300'
                                }`}>
                                  {t.assignee}
                                </span>
                              </div>
                            ))}

                            {totalItems === 0 && (
                              <div class="h-full flex items-center justify-center text-[11px] text-slate-300 dark:text-slate-600 py-6">
                                Свободно
                              </div>
                            )}
                          </div>
                        </div>

                        <div class={`text-[10px] text-center ${theme.textAccent} font-semibold mt-2 pt-1 border-t border-slate-50 dark:border-slate-800`}>
                          {isSelected ? '✓ Выбранный день' : 'Тапнуть чтобы выбрать'}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </main>
            )}

            {/* ВКЛАДКА 3: БЭКЛОГ */}
            {activeTab === 'backlog' && (
              <main class="p-4 space-y-3.5">
                <div class="px-1">
                  <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Дела без даты</h2>
                  <p class="text-[11px] text-slate-500">Планы, покупки на будущее, идеи</p>
                </div>

                <div class="grid grid-cols-4 gap-1 bg-slate-200/80 dark:bg-slate-800/80 p-1 rounded-xl text-xs font-semibold">
                  {['Все', 'Рома', 'Марина', 'Общее'].map((tab) => (
                    <button
                      key={tab}
                      onClick={() => setFilterAssignee(tab)}
                      class={`py-1.5 rounded-lg transition-all text-center ${
                        filterAssignee === tab ? `bg-white dark:bg-slate-900 ${theme.textAccent} shadow-sm font-bold` : 'text-slate-600 dark:text-slate-400'
                      }`}
                    >
                      {tab}
                    </button>
                  ))}
                </div>

                <form onSubmit={addBacklogTask} class="bg-white dark:bg-slate-900 p-2.5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 flex gap-2">
                  <input
                    type="text"
                    placeholder="Например: Починить полку..."
                    value={newBacklogText}
                    onChange={(e) => setNewBacklogText(e.target.value)}
                    class="flex-1 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs outline-none focus:border-indigo-500 text-slate-800 dark:text-slate-100 placeholder-slate-400"
                  />
                  <select
                    value={newBacklogAssignee}
                    onChange={(e) => setNewBacklogAssignee(e.target.value)}
                    class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-medium rounded-xl px-2 text-slate-700 dark:text-slate-200 outline-none"
                  >
                    <option value="Общее">Оба</option>
                    <option value="Рома">Рома</option>
                    <option value="Марина">Марина</option>
                  </select>
                  <button type="submit" class={`${theme.primary} text-white px-3.5 py-2 rounded-xl text-sm font-bold active:scale-95 transition`}>
                    +
                  </button>
                </form>

                <div class="space-y-2">
                  {activeBacklogTasks.length === 0 && doneBacklogTasks.length === 0 ? (
                    <div class="text-center py-8 bg-white dark:bg-slate-900 rounded-2xl border border-dashed border-slate-200 dark:border-slate-800 text-slate-400 text-xs">
                      Список свободных дел пуст ✨
                    </div>
                  ) : (
                    activeBacklogTasks.map((task) => (
                      <div
                        key={task.id}
                        class="flex items-center gap-2.5 p-3 bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 transition"
                      >
                        <button
                          onClick={() => toggleBacklog(task)}
                          class="w-6 h-6 rounded-lg border-2 flex items-center justify-center font-bold text-xs transition-all border-slate-300 dark:border-slate-600"
                        >
                          {task.done && '✓'}
                        </button>

                        <div class="flex-1 min-w-0">
                          <p class="text-xs font-medium leading-tight truncate text-slate-800 dark:text-slate-100">
                            {task.text}
                          </p>
                        </div>

                        <span class={`text-[10px] font-bold px-2 py-0.5 rounded-md ${
                          task.assignee === 'Рома' ? 'bg-sky-100 dark:bg-sky-950/80 text-sky-800 dark:text-sky-300' :
                          task.assignee === 'Марина' ? 'bg-pink-100 dark:bg-pink-950/80 text-pink-700 dark:text-pink-300' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'
                        }`}>
                          {task.assignee}
                        </span>

                        <button onClick={() => deleteBacklogTask(task.id)} class="text-slate-300 dark:text-slate-600 hover:text-rose-500 text-xs p-1">
                          ✕
                        </button>
                      </div>
                    ))
                  )}

                  {doneBacklogTasks.length > 0 && (
                    <div class="pt-2 border-t border-slate-200/60 dark:border-slate-800">
                      <button
                        onClick={() => setIsBacklogDoneOpen(!isBacklogDoneOpen)}
                        class="w-full flex items-center justify-between py-2 px-2 text-xs font-bold text-slate-500 dark:text-slate-400 hover:text-slate-700 transition"
                      >
                        <span class="flex items-center gap-1.5">
                          <span>✓</span>
                          <span>Выполнено ({doneBacklogTasks.length})</span>
                        </span>
                        <span class="text-[10px] transform transition-transform duration-200">{isBacklogDoneOpen ? '▲' : '▼'}</span>
                      </button>

                      {isBacklogDoneOpen && (
                        <div class="space-y-2 pt-1">
                          {doneBacklogTasks.map((task) => (
                            <div
                              key={task.id}
                              class="flex items-center gap-2.5 p-3 bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 transition opacity-50 bg-slate-50/80 dark:bg-slate-900/60"
                            >
                              <button
                                onClick={() => toggleBacklog(task)}
                                class="w-6 h-6 rounded-lg border-2 flex items-center justify-center font-bold text-xs transition-all bg-emerald-500 border-emerald-500 text-white"
                              >
                                ✓
                              </button>

                              <div class="flex-1 min-w-0">
                                <p class="text-xs font-medium leading-tight truncate line-through text-slate-400 dark:text-slate-500">
                                  {task.text}
                                </p>
                              </div>

                              <span class={`text-[10px] font-bold px-2 py-0.5 rounded-md ${
                                task.assignee === 'Рома' ? 'bg-sky-100 dark:bg-sky-950/80 text-sky-800 dark:text-sky-300' :
                                task.assignee === 'Марина' ? 'bg-pink-100 dark:bg-pink-950/80 text-pink-700 dark:text-pink-300' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'
                              }`}>
                                {task.assignee}
                              </span>

                              <button onClick={() => deleteBacklogTask(task.id)} class="text-slate-300 dark:text-slate-600 hover:text-rose-500 text-xs p-1">
                                ✕
                              </button>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </main>
            )}

            {/* ВКЛАДКА 4: РЕЦЕПТЫ */}
            {activeTab === 'recipes' && (
              <main class="p-4 space-y-4">
                <div class="flex justify-between items-center px-1">
                  <div>
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Кулинарная книга</h2>
                    <p class="text-[11px] text-slate-500">{recipes.length} рецептов и ссылок</p>
                  </div>
                  <div class="flex gap-1.5">
                    <button
                      onClick={() => setIsQuickLinkOpen(!isQuickLinkOpen)}
                      class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 text-[11px] font-bold py-1.5 px-2.5 rounded-xl active:scale-95 transition shadow-2xs"
                    >
                      🔗 Ссылка
                    </button>
                    <button
                      onClick={() => setIsRecipeModalOpen(true)}
                      class={`${theme.primary} text-white text-[11px] font-bold py-1.5 px-3 rounded-xl active:scale-95 transition shadow-2xs`}
                    >
                      + Свой рецепт
                    </button>
                  </div>
                </div>

                {isQuickLinkOpen && (
                  <form onSubmit={handleQuickLinkSubmit} class="bg-white dark:bg-slate-900 rounded-2xl p-3.5 shadow-sm border border-slate-200/80 dark:border-slate-800 space-y-2.5">
                    <div class="flex justify-between items-center">
                      <span class="text-xs font-bold text-slate-800 dark:text-slate-100">Быстро сохранить ссылку на блюдо</span>
                      <button type="button" onClick={() => setIsQuickLinkOpen(false)} class="text-slate-400 text-xs">✕</button>
                    </div>
                    <input
                      type="url"
                      required
                      placeholder="Вставьте ссылку (https://...)"
                      value={quickLinkUrl}
                      onChange={(e) => setQuickLinkUrl(e.target.value)}
                      class="w-full bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs outline-none focus:border-indigo-500 text-slate-800 dark:text-slate-100 placeholder-slate-400"
                    />
                    <div class="flex gap-2">
                      <input
                        type="text"
                        placeholder="Название (по желанию)"
                        value={quickLinkTitle}
                        onChange={(e) => setQuickLinkTitle(e.target.value)}
                        class="flex-1 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-1.5 text-xs outline-none text-slate-800 dark:text-slate-100"
                      />
                      <select
                        value={quickLinkCategory}
                        onChange={(e) => setQuickLinkCategory(e.target.value)}
                        class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs rounded-xl px-2 py-1.5 text-slate-700 dark:text-slate-200 outline-none"
                      >
                        <option value="Завтрак">Завтрак</option>
                        <option value="Обед">Обед</option>
                        <option value="Ужин">Ужин</option>
                        <option value="Десерты">Десерты</option>
                        <option value="Напитки">Напитки</option>
                      </select>
                      <button type="submit" class={`${theme.primary} text-white text-xs font-bold px-4 py-1.5 rounded-xl active:scale-95`}>
                        Сохранить
                      </button>
                    </div>
                  </form>
                )}

                <div class="flex gap-1.5 overflow-x-auto no-scrollbar py-0.5">
                  {['Все', 'Завтрак', 'Обед', 'Ужин', 'Десерты', 'Напитки'].map(cat => (
                    <button
                      key={cat}
                      onClick={() => setRecipeCategoryFilter(cat)}
                      class={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${
                        recipeCategoryFilter === cat 
                          ? `${theme.activeBtn} shadow-xs` 
                          : 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-850'
                      }`}
                    >
                      {cat}
                    </button>
                  ))}
                </div>

                <div class="space-y-3">
                  {filteredRecipes.length === 0 ? (
                    <div class="text-center py-10 bg-white dark:bg-slate-900 rounded-2xl border border-dashed border-slate-200 dark:border-slate-800 text-slate-400 text-xs">
                      В категории «{recipeCategoryFilter}» пока нет рецептов.
                    </div>
                  ) : (
                    filteredRecipes.map(recipe => {
                      const link = recipe.sourceurl || recipe.sourceUrl;

                      return (
                        <div key={recipe.id} class="bg-white dark:bg-slate-900 rounded-2xl p-3.5 shadow-sm border border-slate-100 dark:border-slate-800 space-y-2">
                          <div class="flex justify-between items-start gap-2">
                            <div class="min-w-0">
                              <span class={`text-[10px] font-bold uppercase tracking-wider ${theme.btnLight} px-2 py-0.5 rounded-md inline-block`}>
                                {recipe.category}
                              </span>
                              <h4 class="text-sm font-bold text-slate-800 dark:text-slate-100 mt-1 leading-snug">
                                {recipe.title}
                              </h4>
                            </div>
                            <div class="flex items-center gap-2 shrink-0">
                              {recipe.time && <span class="text-xs text-slate-400">⏱️ {recipe.time}</span>}
                              <button 
                                onClick={() => deleteRecipe(recipe.id)}
                                class="text-slate-300 dark:text-slate-600 hover:text-rose-500 text-xs p-1"
                              >
                                ✕
                              </button>
                            </div>
                          </div>

                          {link && (
                            <a
                              href={link}
                              target="_blank"
                              rel="noopener noreferrer"
                              class="inline-flex items-center gap-1.5 text-xs font-semibold text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-950/40 hover:bg-blue-100 px-3 py-1.5 rounded-xl transition mt-1"
                            >
                              <span>🔗</span> Открыть рецепт на сайте ↗
                            </a>
                          )}

                          {recipe.ingredients && recipe.ingredients.length > 0 && (
                            <div class="text-xs text-slate-600 dark:text-slate-300 space-y-0.5 pt-1">
                              <p class="font-bold text-slate-500 dark:text-slate-400 text-[11px] mb-0.5">Ингредиенты:</p>
                              {recipe.ingredients.map((ing, i) => (
                                <div key={i} class="flex items-center gap-1.5 text-slate-600 dark:text-slate-300">
                                  <span class="w-1.5 h-1.5 rounded-full bg-slate-400 shrink-0"></span>
                                  <span>{ing}</span>
                                </div>
                              ))}
                            </div>
                          )}

                          {recipe.steps && (
                            <p class="text-xs text-slate-600 dark:text-slate-300 whitespace-pre-line leading-relaxed bg-slate-50 dark:bg-slate-800/60 p-2.5 rounded-xl border border-slate-100 dark:border-slate-700/60">
                              {recipe.steps}
                            </p>
                          )}

                          {recipe.ingredients && recipe.ingredients.length > 0 && (
                            <button
                              onClick={() => addIngredientsToCart(recipe.ingredients)}
                              class={`w-full ${theme.btnLight} text-xs font-bold py-1.5 rounded-xl transition mt-1.5`}
                            >
                              🛒 Добавить ингредиенты в покупки
                            </button>
                          )}
                        </div>
                      );
                    })
                  )}
                </div>

                {isRecipeModalOpen && (
                  <div class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
                    <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 w-full max-w-sm space-y-3 max-h-[90vh] overflow-y-auto border border-slate-200 dark:border-slate-800 shadow-2xl">
                      <div class="flex justify-between items-center">
                        <h3 class="text-sm font-bold text-slate-800 dark:text-slate-100">Добавить рецепт</h3>
                        <button onClick={() => setIsRecipeModalOpen(false)} class="text-slate-400 text-base">✕</button>
                      </div>

                      <form onSubmit={handleAddCustomRecipe} class="space-y-2.5">
                        <input
                          type="text"
                          required
                          placeholder="Название блюда *"
                          value={recipeForm.title}
                          onChange={(e) => setRecipeForm({ ...recipeForm, title: e.target.value })}
                          class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs outline-none focus:border-indigo-500 text-slate-800 dark:text-slate-100"
                        />
                        <div class="flex gap-2">
                          <select
                            value={recipeForm.category}
                            onChange={(e) => setRecipeForm({ ...recipeForm, category: e.target.value })}
                            class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs rounded-xl px-2.5 py-2 text-slate-700 dark:text-slate-200 outline-none flex-1"
                          >
                            <option value="Завтрак">Завтрак</option>
                            <option value="Обед">Обед</option>
                            <option value="Ужин">Ужин</option>
                            <option value="Десерты">Десерты</option>
                            <option value="Напитки">Напитки</option>
                          </select>
                          <input
                            type="text"
                            placeholder="Время (напр. 30 мин)"
                            value={recipeForm.time}
                            onChange={(e) => setRecipeForm({ ...recipeForm, time: e.target.value })}
                            class="w-32 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-2.5 py-2 text-xs outline-none text-slate-800 dark:text-slate-100"
                          />
                        </div>

                        <input
                          type="url"
                          placeholder="Ссылка на рецепт в сети (по желанию)"
                          value={recipeForm.url}
                          onChange={(e) => setRecipeForm({ ...recipeForm, url: e.target.value })}
                          class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs outline-none text-slate-800 dark:text-slate-100"
                        />

                        <textarea
                          rows="3"
                          placeholder="Ингредиенты (каждый с новой строчки)..."
                          value={recipeForm.ingredientsText}
                          onChange={(e) => setRecipeForm({ ...recipeForm, ingredientsText: e.target.value })}
                          class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs outline-none text-slate-800 dark:text-slate-100"
                        ></textarea>

                        <textarea
                          rows="3"
                          placeholder="Шаги приготовления..."
                          value={recipeForm.steps}
                          onChange={(e) => setRecipeForm({ ...recipeForm, steps: e.target.value })}
                          class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs outline-none text-slate-800 dark:text-slate-100"
                        ></textarea>

                        <button type="submit" class={`w-full ${theme.primary} text-white text-xs font-bold py-2.5 rounded-xl shadow-md active:scale-98`}>
                          Сохранить в планер
                        </button>
                      </form>
                    </div>
                  </div>
                )}
              </main>
            )}

            {/* ВКЛАДКА 5: ПОКУПКИ */}
            {activeTab === 'cart' && (
              <main class="p-4 space-y-3.5">
                <div class="flex justify-between items-center px-1">
                  <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">
                    Список покупок ({shoppingList.filter(i => !i.done).length} осталось)
                  </h2>
                  <div class="flex gap-2">
                    <button
                      onClick={addStandardGroceryKit}
                      class="text-[11px] font-bold text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-950/40 hover:bg-indigo-100 px-2.5 py-1 rounded-xl transition"
                    >
                      + Стандартный набор
                    </button>
                    {shoppingList.some(i => i.done) && (
                      <button
                        onClick={clearCompletedShopping}
                        class="text-[11px] font-bold text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 px-2 py-1 rounded-xl transition"
                      >
                        Очистить ✓
                      </button>
                    )}
                  </div>
                </div>

                <form onSubmit={addShopItem} class="bg-white dark:bg-slate-900 p-2 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 flex gap-2">
                  <input
                    type="text"
                    placeholder="Что купить в магазине..."
                    value={newShopItem}
                    onChange={(e) => setNewShopItem(e.target.value)}
                    class="flex-1 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs outline-none focus:border-indigo-500 text-slate-800 dark:text-slate-100 placeholder-slate-400"
                  />
                  <button type="submit" class={`${theme.primary} text-white px-3.5 py-2 rounded-xl text-sm font-bold active:scale-95 transition`}>
                    +
                  </button>
                </form>

                <div class="space-y-1.5">
                  {shoppingList.map(item => (
                    <div
                      key={item.id}
                      onClick={() => toggleShopItem(item)}
                      class={`flex items-center justify-between p-3 bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-100 dark:border-slate-800 cursor-pointer transition ${
                        item.done ? 'opacity-40 line-through bg-slate-50 dark:bg-slate-900/40' : ''
                      }`}
                    >
                      <div class="flex items-center gap-2.5 min-w-0">
                        <div class={`w-5 h-5 rounded-md border flex items-center justify-center text-xs font-bold ${
                          item.done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 dark:border-slate-600'
                        }`}>
                          {item.done && '✓'}
                        </div>
                        <span class="text-xs font-medium text-slate-700 dark:text-slate-200 truncate">{item.text}</span>
                      </div>
                      <button
