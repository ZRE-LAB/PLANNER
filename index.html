<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Семейный планер: Рома & Марина</title>

  <!-- PWA настройки для iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Планер" />
  <meta name="theme-color" content="#4f46e5" />

  <!-- Tailwind CSS -->
  <script src="https://tailwindcss.com"></script>
  <!-- React и ReactDOM -->
  <script src="https://unpkg.com"></script>
  <script src="https://unpkg.com"></script>
  <!-- Babel -->
  <script src="https://unpkg.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://jsdelivr.net"></script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea, select {
      user-select: auto;
    }
    .pt-safe {
      padding-top: env(safe-area-inset-top, 20px);
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans no-scrollbar">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Инициализация Supabase
    const SUPABASE_URL = "https://supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qZGRlb3preHh4anpwZnByY3BjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyNzMyNzEsImV4cCI6MjEwODg0OTI3MX0.WDsDxRQLzI1s_ZNaf5FNyYkvBxBwNvCzfLo8mCwJkrI";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function App() {
      const [activeTab, setActiveTab] = useState('events'); // events, shopping, tasks
      const [currentUser, setCurrentUser] = useState('Общее'); // Рома, Марина, Общее

      // Состояния данных
      const [events, setEvents] = useState([]);
      const [shoppingList, setShoppingList] = useState([]);
      const [tasks, setTasks] = useState([]);

      // Состояния форм ввода
      const [newEvent, setNewEvent] = useState({ title: '', date: new Date().toISOString().split('T')[0], category: 'Общее' });
      const [newShopItem, setNewShopItem] = useState('');
      const [newTask, setNewTask] = useState('');

      // Первичная загрузка данных
      const fetchData = async () => {
        const { data: eventsData } = await supabase.from('events').select('*').order('date', { ascending: true });
        if (eventsData) setEvents(eventsData);

        const { data: shopData } = await supabase.from('shopping').select('*').order('created_at', { ascending: false });
        if (shopData) setShoppingList(shopData);

        const { data: tasksData } = await supabase.from('tasks').select('*').order('created_at', { ascending: false });
        if (tasksData) setTasks(tasksData);
      };

      useEffect(() => {
        fetchData();

        // Настройка Realtime подписок для мгновенного обновления интерфейса
        const channel = supabase
          .channel('schema-db-changes')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'events' }, () => { fetchData(); })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'shopping' }, () => { fetchData(); })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, () => { fetchData(); })
          .subscribe();

        // Отписываемся при уничтожении компонента
        return () => {
          supabase.removeChannel(channel);
        };
      }, []);

      // Логика работы с событиями
      const handleAddEvent = async (e) => {
        e.preventDefault();
        if (!newEvent.title.trim()) return;
        const { error } = await supabase.from('events').insert([newEvent]);
        if (!error) {
          setNewEvent({ title: '', date: new Date().toISOString().split('T')[0], category: currentUser });
        }
      };

      const handleDeleteEvent = async (id) => {
        await supabase.from('events').delete().eq('id', id);
      };

      // Логика работы с покупками
      const handleAddShopItem = async (e) => {
        e.preventDefault();
        if (!newShopItem.trim()) return;
        const { error } = await supabase.from('shopping').insert([{ name: newShopItem, bought: false, user: currentUser }]);
        if (!error) {
          setNewShopItem('');
        }
      };

      const toggleShopItem = async (item) => {
        await supabase.from('shopping').update({ bought: !item.bought }).eq('id', item.id);
      };

      const clearBoughtItems = async () => {
        await supabase.from('shopping').delete().eq('bought', true);
      };

      // Логика работы с задачами
      const handleAddTask = async (e) => {
        e.preventDefault();
        if (!newTask.trim()) return;
        const { error } = await supabase.from('tasks').insert([{ title: newTask, completed: false, assignee: currentUser }]);
        if (!error) {
          setNewTask('');
        }
      };

      const toggleTask = async (task) => {
        await supabase.from('tasks').update({ completed: !task.completed }).eq('id', task.id);
      };

      const handleDeleteTask = async (id) => {
        await supabase.from('tasks').delete().eq('id', id);
      };

      return (
        <div class="flex flex-col h-screen max-w-md mx-auto bg-slate-50 shadow-2xl relative overflow-hidden">
          
          {/* Шапка приложения */}
          <header class="bg-indigo-600 text-white px-4 pt-safe pb-4 shadow-md flex justify-between items-center shrink-0">
            <div>
              <h1 class="text-xl font-bold tracking-tight">Наш Планер</h1>
              <p class="text-xs text-indigo-200">Рома & Марина</p>
            </div>
            <select 
              value={currentUser} 
              onChange={(e) => setCurrentUser(e.target.value)}
              class="bg-indigo-700 text-white text-sm rounded-lg px-3 py-1.5 font-medium border border-indigo-500 focus:outline-none"
            >
              <option value="Общее">🏡 Общее</option>
              <option value="Рома">👨 Рома</option>
              <option value="Марина">👩 Марина</option>
            </select>
          </header>

          {/* Контент */}
          <main class="flex-1 overflow-y-auto px-4 py-4 pb-24 no-scrollbar">
            
            {/* ВКЛАДКА: СОБЫТИЯ */}
            {activeTab === 'events' && (
              <div class="space-y-4">
                <h2 class="text-lg font-bold text-slate-700 flex items-center gap-2">📅 Семейный календарь</h2>
                
                <form onSubmit={handleAddEvent} class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
                  <input 
                    type="text" 
                    placeholder="Название события..." 
                    value={newEvent.title}
                    onChange={(e) => setNewEvent({...newEvent, title: e.target.value, category: currentUser})}
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500"
                  />
                  <div class="flex gap-2">
                    <input 
                      type="date" 
                      value={newEvent.date}
                      onChange={(e) => setNewEvent({...newEvent, date: e.target.value})}
                      class="flex-1 px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500"
                    />
                    <button type="submit" class="bg-indigo-600 text-white px-5 py-2 rounded-xl text-sm font-medium hover:bg-indigo-700 active:scale-95 transition-transform">
                      Добавить
                    </button>
                  </div>
                </form>

                <div class="space-y-2">
                  {events.length === 0 ? (
                    <p class="text-center text-sm text-slate-400 py-8">Пока нет запланированных событий</p>
                  ) : (
                    events.map(ev => (
                      <div key={ev.id} class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center">
                        <div class="flex flex-col gap-1">
                          <span class="text-sm font-semibold text-slate-800">{ev.title}</span>
                          <div class="flex items-center gap-2 text-xs text-slate-500">
                            <span class="bg-slate-100 px-2 py-0.5 rounded-full font-medium text-slate-600">{ev.date}</span>
                            <span class={`px-2 py-0.5 rounded-full font-medium ${
                              ev.category === 'Рома' ? 'bg-blue-50 text-blue-600' : 
                              ev.category === 'Марина' ? 'bg-pink-50 text-pink-600' : 'bg-purple-50 text-purple-600'
                            }`}>{ev.category === 'Общее' ? '🏡 Все' : ev.category}</span>
                          </div>
                        </div>
                        <button onClick={() => handleDeleteEvent(ev.id)} class="text-slate-300 hover:text-red-500 p-1">
                          ✕
                        </button>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}

            {/* ВКЛАДКА: СПИСОК ПОКУПОК */}
            {activeTab === 'shopping' && (
              <div class="space-y-4">
                <div class="flex justify-between items-center">
