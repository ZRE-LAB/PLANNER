        steps: "1. Смешать хлопья, яйцо и молоко вилкой, дать постоять 3 минуты.\n2. Вылить на сухую антипригарную сковороду и жарить под крышкой.\n3. На одну половину выложить сыр и ломтики помидора, накрыть второй половиной.",

        steps: "1. Отварить пасту аль-денте.\n2. На оливковом масле прогреть чеснок, добавить рубленые томаты и тушить 7 минут.\n3. Добавить размятый тунец и перемешать с горячей пастой.",

    function formatDateToDDMMYY(isoDateStr) {
      if (!isoDateStr) return '';
      const parts = isoDateStr.split('-');
      if (parts.length !== 3) return isoDateStr;
      return `${parts[2]}.${parts[1]}.${parts[0].slice(-2)}`;
    }

    function FamilyPlanner() {
      const [activeTab, setActiveTab] = useState('calendar');
      const [currentUser, setCurrentUser] = useState(() => localStorage.getItem('fp_user') || 'Рома');
      const [selectedDate, setSelectedDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [calendarViewDate, setCalendarViewDate] = useState(() => new Date());

      const [tasks, setTasks] = useState([]);
      const [backlogTasks, setBacklogTasks] = useState([]);
      const [scheduleEvents, setScheduleEvents] = useState([]);
      const [customRecipes, setCustomRecipes] = useState([]);
      const [shoppingList, setShoppingList] = useState([]);
      const [loading, setLoading] = useState(true);

      const [filterAssignee, setFilterAssignee] = useState('Все');

      // Рецепты: состояние генератора
      const [currentRecipeIdea, setCurrentRecipeIdea] = useState(WEB_RECIPES_DATABASE[0]);
      const [recipeMealType, setRecipeMealType] = useState('Любое');
      const [isAiLoading, setIsAiLoading] = useState(false);

      // Формы ввода
      const [newTaskText, setNewTaskText] = useState('');
      const [newTaskTime, setNewTaskTime] = useState('');
      const [newTaskAssignee, setNewTaskAssignee] = useState('Общее');

      const [newBacklogText, setNewBacklogText] = useState('');
      const [newBacklogAssignee, setNewBacklogAssignee] = useState('Общее');

      const [kanbanTime, setKanbanTime] = useState('10:00');
      const [kanbanTitle, setKanbanTitle] = useState('');
      const [kanbanCategory, setKanbanCategory] = useState('Спортзал');
      const [kanbanAssignee, setKanbanAssignee] = useState('Общее');

      const [newShopItem, setNewShopItem] = useState('');

      const [isRecipeModalOpen, setIsRecipeModalOpen] = useState(false);
      const [recipeForm, setRecipeForm] = useState({
        title: '',
        category: 'Ужин',
        time: '',
        ingredientsText: '',
        steps: ''
      });

      // Темизация (Рома: Синий / Марина: Розовый)
      const isMarina = currentUser === 'Марина';
      const theme = {
        primary: isMarina ? 'bg-rose-500' : 'bg-blue-600',
        primaryHover: isMarina ? 'hover:bg-rose-600' : 'hover:bg-blue-700',
        headerBadge: isMarina ? 'bg-rose-600/90 border-rose-400/50' : 'bg-blue-700/90 border-blue-500/50',
        activePill: isMarina ? 'bg-rose-50 text-rose-600' : 'bg-blue-50 text-blue-600',
        activeBtn: isMarina ? 'bg-rose-500 text-white' : 'bg-blue-600 text-white',
        borderActive: isMarina ? 'border-rose-400' : 'border-blue-500',
        ringActive: isMarina ? 'ring-rose-200 border-rose-500' : 'ring-blue-200 border-blue-500',
        textAccent: isMarina ? 'text-rose-600' : 'text-blue-600',
        cardBg: isMarina ? 'bg-rose-50/70 border-rose-100' : 'bg-blue-50/70 border-blue-100',
        btnLight: isMarina ? 'bg-rose-100 text-rose-700 hover:bg-rose-200' : 'bg-blue-100 text-blue-700 hover:bg-blue-200'
      };

      const toggleUserRole = () => {
        const nextUser = currentUser === 'Рома' ? 'Марина' : 'Рома';
        setCurrentUser(nextUser);
        localStorage.setItem('fp_user', nextUser);
      };

      // Случайный рецепт из базы русскоязычных сайтов (без фото)
      const getNextWebRecipe = () => {
        const pool = recipeMealType === 'Любое' 
          ? WEB_RECIPES_DATABASE 
          : WEB_RECIPES_DATABASE.filter(r => r.category === recipeMealType);
        
        const list = pool.length > 0 ? pool : WEB_RECIPES_DATABASE;
        const next = list[Math.floor(Math.random() * list.length)];
        setCurrentRecipeIdea(next);
      };

      // Генерация рецепта через ИИ
      const generateAiRecipe = async () => {
        setIsAiLoading(true);
        const mealPrompt = recipeMealType === 'Любое' ? 'домашнее блюдо' : recipeMealType;
        const promptText = `Придумай простой вкусный домашний рецепт на ${mealPrompt} для семьи. Ответь СТРОГО в формате JSON без кавычек и markdown: {"title":"Название","category":"${recipeMealType === 'Любое' ? 'Ужин' : recipeMealType}","time":"30 мин","source":"ИИ Шеф-повар","ingredients":["продукт 1","продукт 2"],"steps":"1. Шаг один\\n2. Шаг два"}`;

        try {
          // Запрос к бесплатному публичному API ИИ
          const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(promptText)}?json=true`);
          if (!response.ok) throw new Error('AI Error');
          const text = await response.text();
          
          // Очистка ответа от лишних символов
          const cleanJson = text.replace(/```json/g, '').replace(/```/g, '').trim();
          const parsed = JSON.parse(cleanJson);
          
          if (parsed.title && parsed.ingredients) {
            setCurrentRecipeIdea(parsed);
          } else {
            throw new Error('Bad format');
          }
        } catch (err) {
          // Если сеть или API сбоит, плавно берем случайный из кулинарной базы
          getNextWebRecipe();
        } finally {
          setIsAiLoading(false);
        }
      };

      const fetchData = async () => {
        try {
          const [tRes, bRes, sRes, rRes, shRes] = await Promise.all([
            supabase.from('tasks').select('*').order('created_at', { ascending: false }),
            supabase.from('backlog').select('*').order('created_at', { ascending: false }),
            supabase.from('schedule').select('*').order('time', { ascending: true }),
            supabase.from('recipes').select('*').order('id', { ascending: false }),
            supabase.from('shopping').select('*').order('created_at', { ascending: false })
          ]);

          if (tRes.data) setTasks(tRes.data);
          if (bRes.data) setBacklogTasks(bRes.data);
          if (sRes.data) setScheduleEvents(sRes.data);
          if (rRes.data) setCustomRecipes(rRes.data);
          if (shRes.data) setShoppingList(shRes.data);
        } catch (err) {
          console.error("Ошибка загрузки:", err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchData();

        const channel = supabase
          .channel('schema-db-all-sync')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, () => {
            supabase.from('tasks').select('*').then(res => res.data && setTasks(res.data));
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'backlog' }, () => {
            supabase.from('backlog').select('*').then(res => res.data && setBacklogTasks(res.data));
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'schedule' }, () => {
            supabase.from('schedule').select('*').order('time', { ascending: true }).then(res => res.data && setScheduleEvents(res.data));
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'recipes' }, () => {
            supabase.from('recipes').select('*').order('id', { ascending: false }).then(res => res.data && setCustomRecipes(res.data));
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'shopping' }, () => {
            supabase.from('shopping').select('*').then(res => res.data && setShoppingList(res.data));
          })
          .subscribe();

        return () => supabase.removeChannel(channel);
      }, []);

      const calendarDays = useMemo(() => {
        const year = calendarViewDate.getFullYear();
        const month = calendarViewDate.getMonth();
        const firstDayOfMonth = new Date(year, month, 1);
        const lastDayOfMonth = new Date(year, month + 1, 0);

        let startingDay = firstDayOfMonth.getDay() - 1;
        if (startingDay === -1) startingDay = 6;

        const days = [];
        for (let i = 0; i < startingDay; i++) days.push(null);
        for (let d = 1; d <= lastDayOfMonth.getDate(); d++) {
          const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          days.push({ dayNumber: d, isoDate: iso });
        }
        return days;
      }, [calendarViewDate]);

      const changeMonth = (offset) => {
        setCalendarViewDate(new Date(calendarViewDate.getFullYear(), calendarViewDate.getMonth() + offset, 1));
      };

      const monthName = calendarViewDate.toLocaleString('ru-RU', { month: 'long', year: 'numeric' });

      const currentWeekDays = useMemo(() => {
        const curr = new Date(selectedDate);
        const day = curr.getDay();
        const diff = curr.getDate() - day + (day === 0 ? -6 : 1);
        const monday = new Date(curr.setDate(diff));

        const week = [];
        const dayNames = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
        for (let i = 0; i < 7; i++) {
          const nextDay = new Date(monday);
          nextDay.setDate(monday.getDate() + i);
          const iso = nextDay.toISOString().split('T')[0];
          week.push({
            name: dayNames[i],
            dateStr: formatDateToDDMMYY(iso),
            isoDate: iso,
            dayNum: nextDay.getDate()
          });
        }
        return week;
      }, [selectedDate]);

      const shiftWeek = (offsetDays) => {
        const d = new Date(selectedDate);
        d.setDate(d.getDate() + offsetDays);
        setSelectedDate(d.toISOString().split('T')[0]);
      };

      const goToCurrentWeek = () => {
        const todayIso = new Date().toISOString().split('T')[0];
        setSelectedDate(todayIso);
        setCalendarViewDate(new Date());
      };

      // Работа с задачами
      const toggleTask = async (task) => {
        const nextDone = !task.done;
        setTasks(tasks.map(t => t.id === task.id ? { ...t, done: nextDone } : t));
        await supabase.from('tasks').update({ done: nextDone }).eq('id', task.id);
      };

      const addTask = async (e) => {
        e.preventDefault();
        if (!newTaskText.trim()) return;
        const newTask = {
          id: Date.now().toString(),
          text: newTaskText.trim(),
          time: newTaskTime || null,
          date: selectedDate,
          assignee: newTaskAssignee,
          done: false
        };
        setTasks([newTask, ...tasks]);
        setNewTaskText('');
        setNewTaskTime('');
        await supabase.from('tasks').insert([newTask]);
      };

      const deleteTask = async (id) => {
        setTasks(tasks.filter(t => t.id !== id));
        await supabase.from('tasks').delete().eq('id', id);
      };

      // События недели
      const toggleScheduleEvent = async (ev) => {
        const nextDone = !ev.done;
        setScheduleEvents(scheduleEvents.map(s => s.id === ev.id ? { ...s, done: nextDone } : s));
        await supabase.from('schedule').update({ done: nextDone }).eq('id', ev.id);
      };

      const addScheduleEvent = async (e) => {
        e.preventDefault();
        if (!kanbanTitle.trim()) return;
        const newEv = {
          id: Date.now().toString(),
          title: kanbanTitle.trim(),
          time: kanbanTime,
          date: selectedDate,
          category: kanbanCategory,
          assignee: kanbanAssignee,
          done: false
        };
        setScheduleEvents([...scheduleEvents, newEv]);
        setKanbanTitle('');
        await supabase.from('schedule').insert([newEv]);
      };

      const deleteScheduleEvent = async (id) => {
        setScheduleEvents(scheduleEvents.filter(s => s.id !== id));
        await supabase.from('schedule').delete().eq('id', id);
      };

      // Бэклог
      const toggleBacklog = async (task) => {
        const nextDone = !task.done;
        setBacklogTasks(backlogTasks.map(t => t.id === task.id ? { ...t, done: nextDone } : t));
        await supabase.from('backlog').update({ done: nextDone }).eq('id', task.id);
      };

      const addBacklogTask = async (e) => {
        e.preventDefault();
        if (!newBacklogText.trim()) return;
        const newTask = {
          id: Date.now().toString(),
          text: newBacklogText.trim(),
          assignee: newBacklogAssignee,
          done: false
        };
        setBacklogTasks([newTask, ...backlogTasks]);
        setNewBacklogText('');
        await supabase.from('backlog').insert([newTask]);
      };

      const deleteBacklogTask = async (id) => {
        setBacklogTasks(backlogTasks.filter(t => t.id !== id));
        await supabase.from('backlog').delete().eq('id', id);
      };

      // Рецепты
      const handleAddCustomRecipe = async (e) => {
        e.preventDefault();
        if (!recipeForm.title.trim()) return;

        const ingredientsArr = recipeForm.ingredientsText
          .split('\n')
          .map(i => i.trim())
          .filter(Boolean);

        const newRecipe = {
          id: Date.now().toString(),
          title: recipeForm.title.trim(),
          category: recipeForm.category || 'Ужин',
          time: recipeForm.time || '30 мин',
          ingredients: ingredientsArr.length ? ingredientsArr : ['Ингредиенты по вкусу'],
          steps: recipeForm.steps || 'Готовить с любовью!'
        };

        setCustomRecipes([newRecipe, ...customRecipes]);
        setIsRecipeModalOpen(false);
        setRecipeForm({ title: '', category: 'Ужин', time: '', ingredientsText: '', steps: '' });
        await supabase.from('recipes').insert([newRecipe]);
      };

      const deleteCustomRecipe = async (id) => {
        setCustomRecipes(customRecipes.filter(r => r.id !== id));
        await supabase.from('recipes').delete().eq('id', id);
      };

      const addIngredientsToCart = async (ingredients) => {
        const newItems = ingredients.map(ing => ({
          id: Math.random().toString(),
          text: ing,
          done: false
        }));
        setShoppingList([...newItems, ...shoppingList]);
        alert('Ингредиенты добавлены в покупки!');
        await supabase.from('shopping').insert(newItems);
      };

      // Покупки
      const toggleShopItem = async (item) => {
        const nextDone = !item.done;
        setShoppingList(shoppingList.map(s => s.id === item.id ? { ...s, done: nextDone } : s));
        await supabase.from('shopping').update({ done: nextDone }).eq('id', item.id);
      };

      const addShopItem = async (e) => {
        e.preventDefault();
        if (!newShopItem.trim()) return;
        const newItem = { id: Date.now().toString(), text: newShopItem.trim(), done: false };
        setShoppingList([newItem, ...shoppingList]);
        setNewShopItem('');
        await supabase.from('shopping').insert([newItem]);
      };

      const deleteShopItem = async (id, e) => {
        e.stopPropagation();
        setShoppingList(shoppingList.filter(s => s.id !== id));
        await supabase.from('shopping').delete().eq('id', id);
      };

      const currentTasks = useMemo(() => {
        return tasks
          .filter(t => {
            const matchesDate = t.date === selectedDate;
            const matchesAssignee = filterAssignee === 'Все' || t.assignee === filterAssignee;
            return matchesDate && matchesAssignee;
          })
          .sort((a, b) => {
            if (a.time && b.time) return a.time.localeCompare(b.time);
            if (a.time) return -1;
            if (b.time) return 1;
            return 0;
          });
      }, [tasks, selectedDate, filterAssignee]);

      const currentSchedule = useMemo(() => {
        return scheduleEvents.filter(s => {
          const matchesDate = s.date === selectedDate;
          const matchesAssignee = filterAssignee === 'Все' || s.assignee === filterAssignee;
          return matchesDate && matchesAssignee;
        });
      }, [scheduleEvents, selectedDate, filterAssignee]);

      const currentBacklog = useMemo(() => {
        return backlogTasks.filter(t => filterAssignee === 'Все' || t.assignee === filterAssignee);
      }, [backlogTasks, filterAssignee]);

      return (
        <div class="max-w-md mx-auto min-h-screen bg-slate-50 flex flex-col justify-between pb-28">
          <div>
            {/* Шапка */}
            <header class={`${theme.primary} text-white pt-safe px-4 pb-3 sticky top-0 z-30 shadow-md transition-colors duration-300`}>
              <div class="flex items-center justify-between gap-2 pt-2">
                <div class="min-w-0">
                  <div class="flex items-center gap-1.5">
                    <span class="inline-flex items-center justify-center w-6 h-6 rounded-lg bg-white/20 font-black text-[11px] tracking-tight">
                      Р|М
                    </span>
                    <h1 class="text-base font-bold tracking-tight">Рома & Марина</h1>
                  </div>
                  <div class="flex items-center gap-1.5 mt-0.5">
                    <span class="text-[11px] text-white/80">Роль:</span>
                    <button 
                      onClick={toggleUserRole}
                      class="text-[11px] font-bold bg-white/20 hover:bg-white/30 px-2 py-0.5 rounded-full border border-white/30 active:scale-95 transition"
                    >
                      {currentUser} ⇄
                    </button>
                  </div>
                </div>

                <div class={`shrink-0 flex items-center ${theme.headerBadge} px-3 py-1.5 rounded-xl border shadow-inner`}>
                  <span class="text-xs font-mono font-bold tracking-wider text-white">
                    {formatDateToDDMMYY(selectedDate)}
                  </span>
                </div>
              </div>
            </header>

            {/* ВКЛАДКА 1: КАЛЕНДАРЬ */}
            {activeTab === 'calendar' && (
              <main class="p-4 space-y-3.5">
                <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-100">
                  <div class="flex justify-between items-center mb-3">
                    <h2 class="text-xs font-bold text-slate-800 uppercase tracking-wider capitalize">
                      {monthName}
                    </h2>
                    <div class="flex gap-1.5">
                      <button onClick={() => changeMonth(-1)} class="w-7 h-7 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg flex items-center justify-center font-bold text-xs">
                        ‹
                      </button>
                      <button onClick={() => { setCalendarViewDate(new Date()); setSelectedDate(new Date().toISOString().split('T')[0]); }} class={`px-2 h-7 ${theme.btnLight} rounded-lg text-xs font-semibold`}>
                        Сегодня
                      </button>
                      <button onClick={() => changeMonth(1)} class="w-7 h-7 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg flex items-center justify-center font-bold text-xs">
                        ›
                      </button>
                    </div>
                  </div>

                  <div class="grid grid-cols-7 text-center text-[10px] font-bold text-slate-400 mb-1">
                    <span>ПН</span><span>ВТ</span><span>СР</span><span>ЧТ</span><span>ПТ</span><span>СБ</span><span>ВС</span>
                  </div>

                  <div class="grid grid-cols-7 gap-1">
                    {calendarDays.map((item, idx) => {
                      if (!item) return <div key={idx} class="h-9"></div>;

                      const isSelected = item.isoDate === selectedDate;
                      const isToday = item.isoDate === new Date().toISOString().split('T')[0];
                      
                      const dayTasks = tasks.filter(t => t.date === item.isoDate);
                      const dayEvents = scheduleEvents.filter(s => s.date === item.isoDate);
                      const hasUndone = dayTasks.some(t => !t.done) || dayEvents.some(s => !s.done);
                      const hasDone = dayTasks.some(t => t.done) || dayEvents.some(s => s.done);

                      return (
                        <button
                          key={idx}
                          onClick={() => setSelectedDate(item.isoDate)}
                          class={`h-9 rounded-xl flex flex-col items-center justify-center relative transition ${
                            isSelected 
                              ? `${theme.activeBtn} font-bold shadow-sm` 
                              : isToday 
                              ? `${theme.activePill} font-bold border ${theme.borderActive}` 
                              : 'text-slate-700 hover:bg-slate-100'
                          }`}
                        >
                          <span class="text-xs leading-none">{item.dayNumber}</span>
                          {(dayTasks.length > 0 || dayEvents.length > 0) && (
                            <div class="flex gap-0.5 mt-1">
                              {hasUndone && <span class={`w-1 h-1 rounded-full ${isSelected ? 'bg-white' : 'bg-rose-500'}`}></span>}
                              {hasDone && <span class={`w-1 h-1 rounded-full ${isSelected ? 'bg-white/60' : 'bg-emerald-500'}`}></span>}
                            </div>
                          )}
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div class="grid grid-cols-4 gap-1 bg-slate-200/80 p-1 rounded-xl text-xs font-semibold">
                  {['Все', 'Рома', 'Марина', 'Общее'].map((tab) => (
                    <button
                      key={tab}
                      onClick={() => setFilterAssignee(tab)}
                      class={`py-1.5 rounded-lg transition-all text-center ${
                        filterAssignee === tab ? `bg-white ${theme.textAccent} shadow-sm font-bold` : 'text-slate-600'
                      }`}
                    >
                      {tab}
                    </button>
                  ))}
                </div>

                {/* Добавление задачи */}
                <form onSubmit={addTask} class="bg-white p-2.5 rounded-2xl shadow-sm border border-slate-100 space-y-2">
                  <div class="flex gap-2">
                    <input
                      type="time"
                      value={newTaskTime}
                      onChange={(e) => setNewTaskTime(e.target.value)}
                      class="bg-slate-100 rounded-xl px-2.5 py-1.5 text-xs font-bold text-slate-700 outline-none"
                    />
                    <input
                      type="text"
                      placeholder="Дело на день..."
                      value={newTaskText}
                      onChange={(e) => setNewTaskText(e.target.value)}
                      class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs outline-none focus:border-indigo-500"
                    />
                  </div>
                  <div class="flex gap-2 justify-between items-center">
                    <span class="text-[11px] text-slate-400 pl-1">
                      {newTaskTime ? `Время: ${newTaskTime}` : 'Без времени'}
                    </span>
                    <div class="flex gap-2">
                      <select
                        value={newTaskAssignee}
                        onChange={(e) => setNewTaskAssignee(e.target.value)}
                        class="bg-slate-50 border border-slate-200 text-xs font-medium rounded-xl px-2.5 py-1.5 text-slate-700 outline-none"
                      >
                        <option value="Общее">Оба</option>
                        <option value="Рома">Рома</option>
                        <option value="Марина">Марина</option>
                      </select>
                      <button type="submit" class={`${theme.primary} text-white px-4 py-1.5 rounded-xl text-xs font-bold active:scale-95 transition`}>
                        + Добавить
                      </button>
                    </div>
                  </div>
                </form>

                {/* Расписание недели */}
                {currentSchedule.length > 0 && (
                  <div class="space-y-2">
                    <h3 class={`text-[11px] font-bold ${theme.textAccent} uppercase tracking-wider px-1`}>
                      🕒 Недельный таймлайн ({currentSchedule.length})
                    </h3>
                    <div class="space-y-1.5">
                      {currentSchedule.map(ev => (
                        <div key={ev.id} class={`flex items-center justify-between p-2.5 ${theme.cardBg} rounded-2xl transition ${
                          ev.done ? 'opacity-50 line-through bg-slate-100' : ''
                        }`}>
                          <div class="flex items-center gap-2 min-w-0">
                            <button
                              onClick={() => toggleScheduleEvent(ev)}
                              class={`w-5 h-5 rounded-md border flex items-center justify-center font-bold text-[10px] shrink-0 ${
                                ev.done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 bg-white'
                              }`}
                            >
                              {ev.done && '✓'}
                            </button>
                            <span class={`text-xs font-mono font-bold ${theme.textAccent} bg-white px-1.5 py-0.5 rounded-md shadow-xs shrink-0`}>
                              {ev.time}
                            </span>
                            <span class={`text-xs font-semibold truncate ${ev.done ? 'text-slate-400' : 'text-slate-800'}`}>
                              {ev.title}
                            </span>
                          </div>
                          <div class="flex items-center gap-1.5 shrink-0">
                            <span class="text-[9px] text-slate-500 font-medium">{ev.category}</span>
                            <span class={`text-[9px] font-bold px-1.5 py-0.2 rounded ${
                              ev.assignee === 'Рома' ? 'bg-sky-100 text-sky-800' :
                              ev.assignee === 'Марина' ? 'bg-rose-100 text-rose-800' : 'bg-slate-200 text-slate-700'
                            }`}>
                              {ev.assignee}
                            </span>
                            <button onClick={() => deleteScheduleEvent(ev.id)} class="text-slate-300 hover:text-rose-500 text-xs p-1">✕</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* Задачи на день */}
                <div class="space-y-2">
                  <div class="flex justify-between items-center px-1">
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">
                      Задачи ({currentTasks.length})
                    </h2>
                  </div>

                  {currentTasks.length === 0 && currentSchedule.length === 0 ? (
                    <div class="text-center py-6 bg-white rounded-2xl border border-dashed border-slate-200 text-slate-400 text-xs">
                      Нет дел на {formatDateToDDMMYY(selectedDate)} ☕
                    </div>
                  ) : (
                    currentTasks.map((task) => (
                      <div
                        key={task.id}
                        class={`flex items-center gap-2.5 p-3 bg-white rounded-2xl shadow-sm border border-slate-100 transition ${
                          task.done ? 'opacity-50 bg-slate-50/80' : ''
                        }`}
                      >
                        <button
                          onClick={() => toggleTask(task)}
                          class={`w-6 h-6 rounded-lg border-2 flex items-center justify-center font-bold text-xs transition-all shrink-0 ${
                            task.done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300'
                          }`}
                        >
                          {task.done && '✓'}
                        </button>

                        <div class="flex-1 min-w-0 flex items-center gap-2">
                          {task.time && (
                            <span class={`text-[11px] font-mono font-bold ${theme.textAccent} ${theme.cardBg} px-1.5 py-0.5 rounded-md shrink-0`}>
                              {task.time}
                            </span>
                          )}
                          <p class={`text-xs font-medium leading-tight truncate ${task.done ? 'line-through text-slate-400' : 'text-slate-800'}`}>
                            {task.text}
                          </p>
                        </div>

                        <span class={`text-[10px] font-bold px-2 py-0.5 rounded-md shrink-0 ${
                          task.assignee === 'Рома' ? 'bg-sky-100 text-sky-800' :
                          task.assignee === 'Марина' ? 'bg-rose-100 text-rose-800' : 'bg-slate-100 text-slate-600'
                        }`}>
                          {task.assignee}
                        </span>

                        <button onClick={() => deleteTask(task.id)} class="text-slate-300 hover:text-rose-500 text-xs p-1 shrink-0">
                          ✕
                        </button>
                      </div>
                    ))
                  )}
                </div>
              </main>
            )}

            {/* ВКЛАДКА 2: КАНБАН */}
            {activeTab === 'kanban' && (
              <main class="p-4 space-y-4">
                <div class="flex justify-between items-center px-1">
                  <div>
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Недельный таймлайн</h2>
                    <p class="text-[11px] text-slate-500">Спортзал, врач, другое</p>
                  </div>
                  <div class="flex items-center gap-1">
                    <button 
                      onClick={() => shiftWeek(-7)} 
                      class="w-7 h-7 bg-white hover:bg-slate-100 text-slate-600 rounded-lg flex items-center justify-center font-bold text-xs border border-slate-200 active:scale-95"
                    >
                      ‹
                    </button>
                    <button 
                      onClick={goToCurrentWeek}
                      class={`text-xs font-bold ${theme.btnLight} px-2.5 py-1.5 rounded-lg active:scale-95 transition flex items-center gap-1`}
                    >
                      <span>📅</span> Сегодня
                    </button>
                    <button 
                      onClick={() => shiftWeek(7)} 
                      class="w-7 h-7 bg-white hover:bg-slate-100 text-slate-600 rounded-lg flex items-center justify-center font-bold text-xs border border-slate-200 active:scale-95"
                    >
                      ›
                    </button>
                  </div>
                </div>

                <form onSubmit={addScheduleEvent} class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 space-y-2">
                  <div class="flex gap-2">
                    <input
                      type="time"
                      value={kanbanTime}
                      onChange={(e) => setKanbanTime(e.target.value)}
                      class="bg-slate-100 rounded-xl px-2.5 py-1.5 text-xs font-bold text-slate-700 outline-none"
                    />
                    <input
                      type="text"
                      placeholder="Врач, тренировка, встреча..."
                      value={kanbanTitle}
                      onChange={(e) => setKanbanTitle(e.target.value)}
                      class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs outline-none focus:border-indigo-500"
                    />
                  </div>
                  <div class="flex gap-2">
                    <select
                      value={kanbanCategory}
                      onChange={(e) => setKanbanCategory(e.target.value)}
                      class="flex-1 bg-slate-50 border border-slate-200 text-xs rounded-xl px-2 py-1.5 text-slate-700 outline-none"
                    >
                      <option value="Спортзал">🏋️‍♂️ Спортзал</option>
                      <option value="Врач">🩺 Врач</option>
                      <option value="Встреча">🤝 Встреча</option>
                      <option value="Учеба / Работа">💻 Работа</option>
                      <option value="Отдых">🎉 Отдых</option>
                      <option value="Другое">📌 Другое</option>
                    </select>
                    <select
                      value={kanbanAssignee}
                      onChange={(e) => setKanbanAssignee(e.target.value)}
                      class="bg-slate-50 border border-slate-200 text-xs rounded-xl px-2 py-1.5 text-slate-700 outline-none"
                    >
                      <option value="Общее">Оба</option>
                      <option value="Рома">Рома</option>
                      <option value="Марина">Марина</option>
                    </select>
                    <button type="submit" class={`${theme.primary} text-white px-4 py-1.5 rounded-xl text-xs font-bold active:scale-95`}>
                      + В график
                    </button>
                  </div>
                </form>

                <div class="flex gap-3 overflow-x-auto no-scrollbar pb-2 pt-1 -mx-4 px-4 snap-x">
                  {currentWeekDays.map((col) => {
                    const isSelected = col.isoDate === selectedDate;
                    const dayEvents = scheduleEvents.filter(s => s.date === col.isoDate && (filterAssignee === 'Все' || s.assignee === filterAssignee));
                    const dayTasks = tasks.filter(t => t.date === col.isoDate && (filterAssignee === 'Все' || t.assignee === filterAssignee));
                    const totalItems = dayEvents.length + dayTasks.length;

                    return (
                      <div 
                        key={col.isoDate} 
                        onClick={() => setSelectedDate(col.isoDate)}
                        class={`min-w-[220px] w-[220px] shrink-0 bg-white rounded-2xl p-3 shadow-sm border transition snap-start flex flex-col justify-between cursor-pointer ${
                          isSelected ? theme.ringActive + ' ring-2' : 'border-slate-100'
                        }`}
                      >
                        <div>
                          <div class="flex justify-between items-center pb-2 border-b border-slate-100">
                            <div>
                              <span class="text-xs font-bold text-slate-700">{col.name}</span>
                              <span class="text-[10px] text-slate-400 ml-1.5 font-mono">{col.dateStr}</span>
                            </div>
                            <span class={`text-[10px] font-bold px-1.5 py-0.5 rounded-full ${isSelected ? theme.primary + ' text-white' : 'bg-slate-100 text-slate-500'}`}>
                              {totalItems}
                            </span>
                          </div>

                          <div class="mt-2.5 space-y-2 min-h-[140px]">
                            {dayEvents.map(ev => (
                              <div key={ev.id} class={`p-2 rounded-xl border transition ${
                                ev.done ? 'bg-slate-100/80 border-slate-200 opacity-60' : theme.cardBg
                              }`}>
                                <div class="flex items-center justify-between">
                                  <div class="flex items-center gap-1.5">
                                    <button
                                      onClick={(e) => { e.stopPropagation(); toggleScheduleEvent(ev); }}
                                      class={`w-4 h-4 rounded border flex items-center justify-center font-bold text-[9px] ${
                                        ev.done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 bg-white'
                                      }`}
                                    >
                                      {ev.done && '✓'}
                                    </button>
                                    <span class={`text-[10px] font-mono font-bold ${theme.textAccent} bg-white px-1 rounded shadow-2xs`}>
                                      {ev.time}
                                    </span>
                                  </div>
                                  <span class={`text-[9px] font-bold px-1.5 py-0.2 rounded ${
                                    ev.assignee === 'Рома' ? 'bg-sky-100 text-sky-800' :
                                    ev.assignee === 'Марина' ? 'bg-rose-100 text-rose-800' : 'bg-slate-200 text-slate-700'
                                  }`}>
                                    {ev.assignee}
                                  </span>
                                </div>
                                <p class={`text-xs font-semibold mt-1 leading-tight ${ev.done ? 'line-through text-slate-400' : 'text-slate-800'}`}>
                                  {ev.title}
                                </p>
                                <div class="flex justify-between items-center mt-1">
                                  <span class="text-[9px] text-slate-500 font-medium">{ev.category}</span>
                                  <button 
                                    onClick={(e) => { e.stopPropagation(); deleteScheduleEvent(ev.id); }}
                                    class="text-slate-300 hover:text-rose-500 text-[10px]"
                                  >
                                    ✕
                                  </button>
                                </div>
                              </div>
                            ))}

                            {dayTasks.map(t => (
                              <div key={t.id} class="bg-slate-50 p-2 rounded-xl border border-slate-100 flex items-center justify-between gap-1.5">
                                <div class="flex items-center gap-1.5 min-w-0">
                                  <button
                                    onClick={(e) => { e.stopPropagation(); toggleTask(t); }}
                                    class={`w-4 h-4 rounded border flex items-center justify-center font-bold text-[9px] shrink-0 ${
                                      t.done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 bg-white'
                                    }`}
                                  >
                                    {t.done && '✓'}
                                  </button>
                                  {t.time && (
                                    <span class={`text-[9px] font-mono font-bold ${theme.textAccent} bg-white px-1 rounded shrink-0`}>
                                      {t.time}
                                    </span>
                                  )}
                                  <span class={`text-xs leading-tight truncate ${t.done ? 'line-through text-slate-400' : 'text-slate-700'}`}>
                                    {t.text}
                                  </span>
                                </div>
                                <span class={`text-[8px] font-bold px-1 rounded shrink-0 ${
                                  t.assignee === 'Рома' ? 'bg-sky-100 text-sky-800' :
                                  t.assignee === 'Марина' ? 'bg-rose-100 text-rose-800' : 'bg-slate-200 text-slate-600'
                                }`}>
                                  {t.assignee}
                                </span>
                              </div>
                            ))}

                            {totalItems === 0 && (
                              <div class="h-full flex items-center justify-center text-[11px] text-slate-300 py-6">
                                Свободно
                              </div>
                            )}
                          </div>
                        </div>

                        <div class={`text-[10px] text-center ${theme.textAccent} font-semibold mt-2 pt-1 border-t border-slate-50`}>
                          {isSelected ? '✓ Выбранный день' : 'Тапнуть чтобы выбрать'}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </main>
            )}

            {/* ВКЛАДКА 3: БЭКЛОГ */}
            {activeTab === 'backlog' && (
              <main class="p-4 space-y-3.5">
                <div class="px-1">
                  <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Дела без даты</h2>
                  <p class="text-[11px] text-slate-500">Планы, покупки на будущее, дела без сроков</p>
                </div>

                <div class="grid grid-cols-4 gap-1 bg-slate-200/80 p-1 rounded-xl text-xs font-semibold">
                  {['Все', 'Рома', 'Марина', 'Общее'].map((tab) => (
                    <button
                      key={tab}
                      onClick={() => setFilterAssignee(tab)}
                      class={`py-1.5 rounded-lg transition-all text-center ${
                        filterAssignee === tab ? `bg-white ${theme.textAccent} shadow-sm font-bold` : 'text-slate-600'
                      }`}
                    >
                      {tab}
                    </button>
                  ))}
                </div>

                <form onSubmit={addBacklogTask} class="bg-white p-2.5 rounded-2xl shadow-sm border border-slate-100 flex gap-2">
                  <input
                    type="text"
                    placeholder="Например: Починить полку..."
                    value={newBacklogText}
                    onChange={(e) => setNewBacklogText(e.target.value)}
                    class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs outline-none focus:border-indigo-500"
                  />
                  <select
                    value={newBacklogAssignee}
                    onChange={(e) => setNewBacklogAssignee(e.target.value)}
                    class="bg-slate-50 border border-slate-200 text-xs font-medium rounded-xl px-2 text-slate-700 outline-none"
                  >
                    <option value="Общее">Оба</option>
                    <option value="Рома">Рома</option>
                    <option value="Марина">Марина</option>
                  </select>
                  <button type="submit" class={`${theme.primary} text-white px-3.5 py-2 rounded-xl text-sm font-bold active:scale-95 transition`}>
                    +
                  </button>
                </form>

                <div class="space-y-2">
                  {currentBacklog.length === 0 ? (
                    <div class="text-center py-8 bg-white rounded-2xl border border-dashed border-slate-200 text-slate-400 text-xs">
                      Список свободных дел пуст ✨
                    </div>
                  ) : (
                    currentBacklog.map((task) => (
                      <div
                        key={task.id}
                        class={`flex items-center gap-2.5 p-3 bg-white rounded-2xl shadow-sm border border-slate-100 transition ${
                          task.done ? 'opacity-50 bg-slate-50/80' : ''
                        }`}
                      >
                        <button
                          onClick={() => toggleBacklog(task)}
                          class={`w-6 h-6 rounded-lg border-2 flex items-center justify-center font-bold text-xs transition-all ${
                            task.done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300'
                          }`}
                        >
                          {task.done && '✓'}
                        </button>

                        <div class="flex-1 min-w-0">
                          <p class={`text-xs font-medium leading-tight truncate ${task.done ? 'line-through text-slate-400' : 'text-slate-800'}`}>
                            {task.text}
                          </p>
                        </div>

                        <span class={`text-[10px] font-bold px-2 py-0.5 rounded-md ${
                          task.assignee === 'Рома' ? 'bg-sky-100 text-sky-800' :
                          task.assignee === 'Марина' ? 'bg-rose-100 text-rose-800' : 'bg-slate-100 text-slate-600'
                        }`}>
                          {task.assignee}
                        </span>

                        <button onClick={() => deleteBacklogTask(task.id)} class="text-slate-300 hover:text-rose-500 text-xs p-1">
                          ✕
                        </button>
                      </div>
                    ))
                  )}
                </div>
              </main>
            )}

            {/* ВКЛАДКА 4: РЕЦЕПТЫ (БЕЗ КАРТИНОК + ИИ) */}
            {activeTab === 'recipes' && (
              <main class="p-4 space-y-4">
                <div class="flex justify-between items-center px-1">
                  <div>
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Кулинарная книга</h2>
                    <p class="text-[11px] text-slate-500">Генератор идей без картинок</p>
                  </div>
                  <button
                    onClick={() => setIsRecipeModalOpen(true)}
                    class={`${theme.primary} text-white text-[11px] font-bold py-1.5 px-3 rounded-xl active:scale-95 transition`}
                  >
                    + Свой рецепт
                  </button>
                </div>

                {/* БЛОК ГЕНЕРАТОРА: ИИ + САЙТЫ */}
                <div class="bg-white border border-slate-200/80 rounded-2xl p-4 shadow-sm space-y-3.5">
                  <div class="flex items-center justify-between gap-2">
                    <span class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                      <span>🍲</span> Меню на день:
                    </span>
                    
                    {/* Фильтр категории блюда */}
                    <div class="flex gap-1 bg-slate-100 p-0.5 rounded-lg text-[10px] font-bold">
                      {['Любое', 'Завтрак', 'Обед', 'Ужин'].map(m => (
                        <button
                          key={m}
                          onClick={() => setRecipeMealType(m)}
                          class={`px-2 py-1 rounded-md transition ${recipeMealType === m ? 'bg-white text-slate-800 shadow-xs' : 'text-slate-500'}`}
                        >
                          {m}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Карточка рецепта */}
                  <div class="bg-slate-50/80 rounded-xl p-3.5 border border-slate-200/60 space-y-2.5">
                    <div class="flex justify-between items-start gap-2">
                      <div>
                        <div class="flex items-center gap-2">
                          <span class="text-[10px] font-bold uppercase tracking-wider bg-amber-100 text-amber-800 px-2 py-0.5 rounded-md">
                            {currentRecipeIdea.category || 'Блюдо'}
                          </span>
                          {currentRecipeIdea.source && (
                            <span class="text-[10px] text-slate-400 font-medium">
                              {currentRecipeIdea.source.includes('ИИ') ? '✨ ' : '🌐 '}
                              {currentRecipeIdea.source}
                            </span>
                          )}
                        </div>
                        <h3 class="text-sm font-bold text-slate-800 mt-1.5 leading-snug">
                          {isAiLoading ? 'Шеф-повар думает над блюдом...' : currentRecipeIdea.title}
                        </h3>
                      </div>
                      <span class="text-xs font-semibold text-slate-400 shrink-0">
                        ⏱️ {currentRecipeIdea.time || '25 мин'}
                      </span>
                    </div>

                    {!isAiLoading && (
                      <>
                        {/* Ингредиенты */}
                        <div class="text-xs text-slate-600 space-y-1 pt-1">
                          <p class="font-bold text-slate-500 text-[11px]">Ингредиенты:</p>
                          <div class="grid grid-cols-1 gap-1">
                            {currentRecipeIdea.ingredients && currentRecipeIdea.ingredients.map((ing, i) => (
                              <div key={i} class="flex items-center gap-1.5 text-slate-700">
                                <span class="w-1.5 h-1.5 rounded-full bg-amber-500 shrink-0"></span>
                                <span>{ing}</span>
                              </div>
                            ))}
                          </div>
                        </div>

                        {/* Шаги */}
                        {currentRecipeIdea.steps && (
                          <div class="pt-1 border-t border-slate-200/50">
                            <p class="font-bold text-slate-500 text-[11px] mb-1">Приготовление:</p>
                            <p class="text-xs text-slate-600 whitespace-pre-line leading-relaxed">
                              {currentRecipeIdea.steps}
                            </p>
                          </div>
                        )}

                        <button
                          onClick={() => addIngredientsToCart(currentRecipeIdea.ingredients)}
                          class="w-full bg-amber-500 hover:bg-amber-600 active:scale-98 text-white text-xs font-bold py-2 rounded-xl transition shadow-xs mt-2"
                        >
                          🛒 Добавить ингредиенты в покупки
                        </button>
                      </>
                    )}
                  </div>

                  {/* Кнопки генерации */}
                  <div class="grid grid-cols-2 gap-2 pt-1">
                    <button
                      onClick={getNextWebRecipe}
                      disabled={isAiLoading}
                      class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold py-2 px-3 rounded-xl active:scale-95 transition flex items-center justify-center gap-1"
                    >
                      <span>🎲</span> С сайтов
                    </button>
                    <button
                      onClick={generateAiRecipe}
                      disabled={isAiLoading}
                      class={`${theme.primary} text-white text-xs font-bold py-2 px-3 rounded-xl active:scale-95 transition flex items-center justify-center gap-1 shadow-xs`}
                    >
                      <span>✨</span> {isAiLoading ? 'Генерация...' : 'Придумать с ИИ'}
                    </button>
                  </div>
                </div>

                {/* МОДАЛКА СВОЕГО РЕЦЕПТА */}
                {isRecipeModalOpen && (
                  <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-3xl p-5 w-full max-w-sm space-y-3 max-h-[90vh] overflow-y-auto">
                      <div class="flex justify-between items-center">
                        <h3 class="text-sm font-bold text-slate-800">Добавить рецепт</h3>
                        <button onClick={() => setIsRecipeModalOpen(false)} class="text-slate-400 text-base">✕</button>
                      </div>

                      <form onSubmit={handleAddCustomRecipe} class="space-y-2.5">
                        <input
                          type="text"
                          placeholder="Название блюда (напр. Паста с грибами)"
                          value={recipeForm.title}
                          onChange={(e) => setRecipeForm({ ...recipeForm, title: e.target.value })}
                          class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs outline-none focus:border-indigo-500"
                        />
                        <div class="flex gap-2">
                          <select
                            value={recipeForm.category}
                            onChange={(e) => setRecipeForm({ ...recipeForm, category: e.target.value })}
                            class="bg-slate-50 border border-slate-200 text-xs rounded-xl px-2.5 py-2 text-slate-700 outline-none flex-1"
                          >
                            <option value="Завтрак">Завтрак</option>
                            <option value="Обед">Обед</option>
                            <option value="Ужин">Ужин</option>
                            <option value="Десерт">Десерт</option>
                          </select>
                          <input
                            type="text"
                            placeholder="Время (напр. 30 мин)"
                            value={recipeForm.time}
                            onChange={(e) => setRecipeForm({ ...recipeForm, time: e.target.value })}
                            class="w-32 bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 text-xs outline-none"
                          />
                        </div>

                        <textarea
                          rows="3"
                          placeholder="Ингредиенты (каждый с новой строчки)..."
                          value={recipeForm.ingredientsText}
                          onChange={(e) => setRecipeForm({ ...recipeForm, ingredientsText: e.target.value })}
                          class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs outline-none"
                        ></textarea>

                        <textarea
                          rows="3"
                          placeholder="Шаги приготовления..."
                          value={recipeForm.steps}
                          onChange={(e) => setRecipeForm({ ...recipeForm, steps: e.target.value })}
                          class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs outline-none"
                        ></textarea>

                        <button type="submit" class={`w-full ${theme.primary} text-white text-xs font-bold py-2.5 rounded-xl shadow-md active:scale-98`}>
                          Сохранить в планер
                        </button>
                      </form>
                    </div>
                  </div>
                )}

                {/* МОИ РЕЦЕПТЫ */}
                {customRecipes.length > 0 && (
                  <div class="space-y-3 pt-2">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider px-1">
                      Мои рецепты ({customRecipes.length})
                    </h3>
                    {customRecipes.map(recipe => (
                      <div key={recipe.id} class="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-100 space-y-2">
                        <div class="flex justify-between items-start">
                          <div>
                            <span class={`text-[10px] font-bold uppercase tracking-wider ${theme.btnLight} px-2 py-0.5 rounded-md`}>
                              {recipe.category}
                            </span>
                            <h4 class="text-sm font-bold text-slate-800 mt-1">{recipe.title}</h4>
                          </div>
                          <button 
                            onClick={() => deleteCustomRecipe(recipe.id)}
                            class="text-slate-300 hover:text-rose-500 text-xs p-1"
                          >
                            ✕
                          </button>
                        </div>

                        {recipe.ingredients && recipe.ingredients.length > 0 && (
                          <div class="text-xs text-slate-600 space-y-0.5">
                            {recipe.ingredients.map((ing, i) => (
                              <div key={i} class="flex items-center gap-1.5">
                                <span class={`w-1.5 h-1.5 rounded-full ${isMarina ? 'bg-rose-400' : 'bg-blue-400'} shrink-0`}></span>
                                <span>{ing}</span>
                              </div>
                            ))}
                          </div>
                        )}

                        <button
                          onClick={() => addIngredientsToCart(recipe.ingredients || [])}
                          class={`w-full ${theme.btnLight} text-xs font-bold py-1.5 rounded-xl transition mt-2`}
                        >
                          🛒 В список покупок
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </main>
            )}

            {/* ВКЛАДКА 5: ПОКУПКИ */}
            {activeTab === 'cart' && (
              <main class="p-4 space-y-3.5">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider px-1">
                  Список покупок ({shoppingList.filter(i => !i.done).length} осталось)
                </h2>

                <form onSubmit={addShopItem} class="bg-white p-2 rounded-2xl shadow-sm border border-slate-100 flex gap-2">
                  <input
                    type="text"
                    placeholder="Что купить в магазине..."
                    value={newShopItem}
                    onChange={(e) => setNewShopItem(e.target.value)}
                    class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs outline-none focus:border-indigo-500"
                  />
                  <button type="submit" class={`${theme.primary} text-white px-3.5 py-2 rounded-xl text-sm font-bold active:scale-95 transition`}>
                    +
                  </button>
                </form>

                <div class="space-y-1.5">
                  {shoppingList.map(item => (
                    <div
                      key={item.id}
                      onClick={() => toggleShopItem(item)}
                      class={`flex items-center justify-between p-3 bg-white rounded-xl shadow-sm border border-slate-100 cursor-pointer transition ${
                        item.done ? 'opacity-40 line-through bg-slate-50' : ''
                      }`}
                    >
                      <div class="flex items-center gap-2.5 min-w-0">
                        <div class={`w-5 h-5 rounded-md border flex items-center justify-center text-xs font-bold ${
                          item.done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300'
                        }`}>
                          {item.done && '✓'}
                        </div>
                        <span class="text-xs font-medium text-slate-700 truncate">{item.text}</span>
                      </div>
                      <button 
                        onClick={(e) => deleteShopItem(item.id, e)} 
                        class="text-slate-300 hover:text-rose-500 text-xs px-2 py-1"
                      >
                        ✕
                      </button>
                    </div>
                  ))}
                </div>
              </main>
            )}
          </div>

          {/* Навигация */}
          <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/95 backdrop-blur-md border-t border-slate-200 px-3 pt-2 pb-safe flex justify-around items-center z-40">
            <button
              onClick={() => setActiveTab('calendar')}
              class={`flex flex-col items-center gap-0.5 text-[11px] font-medium transition ${
                activeTab === 'calendar' ? `${theme.textAccent} font-bold` : 'text-slate-400'
              }`}
            >
              <span class="text-base">📅</span>
              Календарь
            </button>
            <button
              onClick={() => setActiveTab('kanban')}
              class={`flex flex-col items-center gap-0.5 text-[11px] font-medium transition ${
                activeTab === 'kanban' ? `${theme.textAccent} font-bold` : 'text-slate-400'
              }`}
            >
              <span class="text-base">📊</span>
              Неделя
            </button>
            <button
              onClick={() => setActiveTab('backlog')}
              class={`flex flex-col items-center gap-0.5 text-[11px] font-medium transition ${
                activeTab === 'backlog' ? `${theme.textAccent} font-bold` : 'text-slate-400'
              }`}
            >
              <span class="text-base">📝</span>
              Без даты
            </button>
            <button
              onClick={() => setActiveTab('recipes')}
              class={`flex flex-col items-center gap-0.5 text-[11px] font-medium transition ${
                activeTab === 'recipes' ? `${theme.textAccent} font-bold` : 'text-slate-400'
              }`}
            >
              <span class="text-base">📖</span>
              Рецепты
            </button>
            <button
              onClick={() => setActiveTab('cart')}
              class={`flex flex-col items-center gap-0.5 text-[11px] font-medium transition ${
                activeTab === 'cart' ? `${theme.textAccent} font-bold` : 'text-slate-400'
              }`}
            >
              <span class="text-base">🛒</span>
              Покупки
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<FamilyPlanner />);
  </script>
</body>
</html>


--
